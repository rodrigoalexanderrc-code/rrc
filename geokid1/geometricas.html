function drawGrid() {
    ctx.fillStyle = COLOR_SURFACE;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const isIso = document.getElementById('gridSelect').value === 'iso';
    const midX = OFF + Math.floor(COLS/2)*CM, midY = OFF + Math.floor(ROWS/2)*CM;

    if (!isIso) {
        // Cuadrícula Ortogonal Normal
        ctx.save();
        ctx.strokeStyle = COLOR_GRID_LINE; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(OFF, midY); ctx.lineTo(OFF+COLS*CM, midY);
        ctx.moveTo(midX, OFF); ctx.lineTo(midX, OFF+ROWS*CM);
        ctx.stroke();
        
        for (let c = 0; c <= COLS; c++) {
            for (let r = 0; r <= ROWS; r++) {
                const x = OFF + c*CM, y = OFF + r*CM;
                ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI*2);
                ctx.fillStyle = COLOR_GRID_DOT; ctx.fill();
            }
        }
        ctx.restore();
    } else {
        // Cuadrícula Isométrica
        const gridY = CM;
        const gridX = CM * Math.sqrt(3) / 2;
        const colsIso = Math.floor((canvas.width - OFF*2) / gridX);
        const rowsIso = Math.floor((canvas.height - OFF*2) / gridY);

        ctx.save();
        ctx.strokeStyle = COLOR_GRID_LINE; 
        ctx.lineWidth = 1.5;

        ctx.beginPath();
        for (let c = 0; c <= colsIso; c++) {
            for (let r = 0; r <= rowsIso; r++) {
                const x = OFF + c * gridX;
                const y = OFF + r * gridY + (c % 2) * (gridY / 2);
                
                // Línea vertical
                if (r < rowsIso) {
                    ctx.moveTo(x, y);
                    ctx.lineTo(x, y + gridY);
                }
                
                // Diagonales
                if (c < colsIso) {
                    if (c % 2 === 0) {
                        ctx.moveTo(x, y);
                        ctx.lineTo(x + gridX, y + gridY / 2);
                        if (r > 0) {
                            ctx.moveTo(x, y);
                            ctx.lineTo(x + gridX, y - gridY / 2);
                        }
                    } else {
                        ctx.moveTo(x, y);
                        ctx.lineTo(x + gridX, y - gridY / 2);
                        if (r < rowsIso) {
                            ctx.moveTo(x, y);
                            ctx.lineTo(x + gridX, y + gridY / 2);
                        }
                    }
                }
            }
        }
        ctx.stroke();
        
        // Puntos isométricos
        for (let c = 0; c <= colsIso; c++) {
            for (let r = 0; r <= rowsIso; r++) {
                const x = OFF + c * gridX;
                const y = OFF + r * gridY + (c % 2) * (gridY / 2);
                ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI*2);
                ctx.fillStyle = COLOR_GRID_DOT; ctx.fill();
            }
        }
        ctx.restore();
    }
    
    // Capa del plano cartesiano superpuesta
    if (showCartesianAxes) {
        ctx.save();
        
        if (!isIso) {
            ctx.strokeStyle = '#a2d5f2'; // Un azul claro para que no interrumpa
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let c = 0; c <= COLS; c++) {
                ctx.moveTo(OFF + c*CM, OFF); ctx.lineTo(OFF + c*CM, OFF + ROWS*CM);
            }
            for (let r = 0; r <= ROWS; r++) {
                ctx.moveTo(OFF, OFF + r*CM); ctx.lineTo(OFF + COLS*CM, OFF + r*CM);
            }
            ctx.stroke();
        }

        ctx.strokeStyle = '#2c3e50'; 
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(OFF, midY); ctx.lineTo(OFF+COLS*CM, midY);
        ctx.moveTo(midX, OFF); ctx.lineTo(midX, OFF+ROWS*CM);
        ctx.stroke();

        ctx.fillStyle = '#2c3e50';
        ctx.font = '12px Arial';
        ctx.textBaseline = 'middle';
        
        for (let c = 0; c <= COLS; c++) {
            const xVal = (c - Math.floor(COLS/2)) * cartesianStep;
            if (xVal !== 0) {
                ctx.textAlign = 'center';
                ctx.fillText(xVal, OFF + c*CM, midY + 15);
            }
        }
        for (let r = 0; r <= ROWS; r++) {
            const yVal = (Math.floor(ROWS/2) - r) * cartesianStep;
            if (yVal !== 0) {
                ctx.textAlign = 'right';
                ctx.fillText(yVal, midX - 8, OFF + r*CM);
            }
        }
        ctx.textAlign = 'right';
        ctx.fillText('0', midX - 8, midY + 15);
        ctx.restore();
    }
}

function drawPoly(s, isSel) {
    if (s.pts.length < 2) return;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(s.pts[0].x, s.pts[0].y);
    s.pts.forEach(p => ctx.lineTo(p.x, p.y));
    if (s.closed) ctx.closePath();

    if (s.closed) { ctx.fillStyle = s.color + 'bb'; ctx.fill(); }
    
    if (isSel) {
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#3498db';
        ctx.shadowColor = '#3498db';
        ctx.shadowBlur = 15;
        ctx.setLineDash([8, 6]);
    } else {
        ctx.strokeStyle = (eraserHover===s.id ? '#cc00ff' : '#5a3010');
        ctx.lineWidth   = (eraserHover===s.id) ? 3.5 : 2.5;
    }
    ctx.stroke();

    s.pts.forEach((p,i) => {
        ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
        ctx.fillStyle = isSel ? '#3498db' : '#7a3800'; ctx.fill();
    });
    
    // Indicador visual de pivote de rotación
    const rotateAxis = document.getElementById('rotateAxis');
    if (isSel && rotateAxis && rotateAxis.value === 'v_custom' && getSelectedShapeIds().length === 1) {
        const pivotIdx = s.pivotIdx || 0;
        if (s.pts[pivotIdx]) {
            const pv = s.pts[pivotIdx];
            ctx.beginPath(); ctx.arc(pv.x, pv.y, 12, 0, Math.PI*2);
            ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 4; ctx.stroke();
            ctx.beginPath(); ctx.arc(pv.x, pv.y, 4, 0, Math.PI*2);
            ctx.fillStyle = '#e74c3c'; ctx.fill();
        }
    }
    
    ctx.restore();
}

function drawCircShape(s, isSel) {
    ctx.save();
    ctx.beginPath(); ctx.arc(s.cx, s.cy, s.r, 0, Math.PI*2);
    ctx.fillStyle = s.color + 'bb'; ctx.fill();

    if (isSel) {
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#3498db';
        ctx.shadowColor = '#3498db';
        ctx.shadowBlur = 15;
        ctx.setLineDash([8, 6]);
    } else {
        ctx.strokeStyle = (eraserHover===s.id ? '#cc00ff' : '#5a3010');
        ctx.lineWidth   = (isSel || eraserHover===s.id) ? 3.5 : 2.5;
    }
    ctx.stroke();
    // centro
    ctx.beginPath(); ctx.arc(s.cx, s.cy, 4, 0, Math.PI*2);
    ctx.fillStyle = isSel ? '#3498db' : '#7a3800'; ctx.fill();
    ctx.restore();
}

function drawInProgress() {
    if (mode === 'draw' && drawPts.length > 0) {
        ctx.save();
        ctx.strokeStyle = '#e8430e'; ctx.lineWidth = 2.5;
        ctx.setLineDash([8,5]);
        ctx.beginPath();
        ctx.moveTo(drawPts[0].x, drawPts[0].y);
        drawPts.forEach(p => ctx.lineTo(p.x, p.y));
        if (hoverSnap) ctx.lineTo(hoverSnap.x, hoverSnap.y);
        ctx.stroke(); ctx.setLineDash([]);

        drawPts.forEach((p,i) => {
            ctx.beginPath(); ctx.arc(p.x, p.y, i===0?9:5.5, 0, Math.PI*2);
            ctx.fillStyle = i===0 ? '#FF3300' : '#ff7722'; ctx.fill();
            ctx.strokeStyle='white'; ctx.lineWidth=1.5; ctx.stroke();
        });
        // anillo verde si hover sobre primer punto
        if (drawPts.length >= 3 && hoverSnap &&
            Math.hypot(hoverSnap.x-drawPts[0].x, hoverSnap.y-drawPts[0].y) < SNAP_DIST) {
            ctx.beginPath(); ctx.arc(drawPts[0].x, drawPts[0].y, 14, 0, Math.PI*2);
            ctx.strokeStyle='#00cc55'; ctx.lineWidth=3; ctx.stroke();
        }
        ctx.restore();

        if (symmetryAxis) {
            ctx.save();
            ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2.5;
            ctx.setLineDash([8,5]);
            ctx.globalAlpha = 0.5;
            ctx.beginPath();
            const rp0 = reflectPoint(drawPts[0].x, drawPts[0].y, symmetryAxis);
            ctx.moveTo(rp0.x, rp0.y);
            drawPts.forEach(p => {
                const rp = reflectPoint(p.x, p.y, symmetryAxis);
                ctx.lineTo(rp.x, rp.y);
            });
            if (hoverSnap) {
                const rh = reflectPoint(hoverSnap.x, hoverSnap.y, symmetryAxis);
                ctx.lineTo(rh.x, rh.y);
            }
            ctx.stroke(); ctx.setLineDash([]);
            ctx.restore();
        }
    }

    if (mode === 'circle' && circDraw && circStart) {
        ctx.save();
        ctx.beginPath(); ctx.arc(circStart.x, circStart.y, Math.max(4, circPrev), 0, Math.PI*2);
        ctx.fillStyle = currentColor + '55';
        ctx.fill();
        ctx.strokeStyle = '#e8430e'; ctx.lineWidth = 2.5; ctx.setLineDash([8,5]);
        ctx.stroke(); ctx.setLineDash([]);
        // centro
        ctx.beginPath(); ctx.arc(circStart.x, circStart.y, 5, 0, Math.PI*2);
        ctx.fillStyle = '#FF3300'; ctx.fill();
        ctx.restore();

        if (symmetryAxis) {
            ctx.save();
            const rStart = reflectPoint(circStart.x, circStart.y, symmetryAxis);
            ctx.beginPath(); ctx.arc(rStart.x, rStart.y, Math.max(4, circPrev), 0, Math.PI*2);
            ctx.fillStyle = currentColor + '55';
            ctx.fill();
            ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2.5; ctx.setLineDash([8,5]);
            ctx.globalAlpha = 0.5;
            ctx.stroke(); ctx.setLineDash([]);
            ctx.restore();
        }
    }
}

function drawHoverDot() {
    if (!hoverSnap) return;
    if (mode === 'draw' || (mode === 'circle' && !circDraw)) {
        ctx.save();
        ctx.beginPath(); ctx.arc(hoverSnap.x, hoverSnap.y, 10, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,100,0,0.22)'; ctx.fill();
        ctx.strokeStyle='#ff6600'; ctx.lineWidth=2; ctx.stroke();
        ctx.restore();
    }
    if (mode === 'eraser') {
        ctx.save();
        ctx.beginPath(); ctx.arc(hoverSnap.x, hoverSnap.y, 18, 0, Math.PI*2);
        ctx.strokeStyle = '#cc00ff'; ctx.lineWidth = 2.5;
        ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);
        ctx.restore();
    }
}

function getPolygonArea(pts) {
    let area = 0;
    for (let i = 0; i < pts.length; i++) {
        const j = (i + 1) % pts.length;
        area += pts[i].x * pts[j].y - pts[j].x * pts[i].y;
    }
    return area / 2;
}

function drawLineHighlight(line, color) {
    if (!line) return;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(line.p1.x, line.p1.y);
    ctx.lineTo(line.p2.x, line.p2.y);
    ctx.strokeStyle = color;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.restore();
}

function getLineIntersection(p1, p2, p3, p4) {
    const denom = (p1.x - p2.x)*(p3.y - p4.y) - (p1.y - p2.y)*(p3.x - p4.x);
    if (Math.abs(denom) < 0.001) return null;
    const x = ((p1.x*p2.y - p1.y*p2.x)*(p3.x - p4.x) - (p1.x - p2.x)*(p3.x*p4.y - p3.y*p4.x)) / denom;
    const y = ((p1.x*p2.y - p1.y*p2.x)*(p3.y - p4.y) - (p1.y - p2.y)*(p3.x*p4.y - p3.y*p4.x)) / denom;
    return {x, y};
}

function sameEdge(e1, e2) {
    return e1 && e2 && e1.shape.id === e2.shape.id && e1.index === e2.index;
}

function drawSelectedAngle() {
    if (angleLine1) drawLineHighlight(angleLine1, '#2ecc71');
    if (angleLine2) drawLineHighlight(angleLine2, '#3498db');
    if (angleHoverLine && (!angleLine1 || !sameEdge(angleLine1, angleHoverLine)) && (!angleLine2 || !sameEdge(angleLine2, angleHoverLine))) {
        drawLineHighlight(angleHoverLine, 'rgba(241, 196, 15, 0.6)');
    }

    if (!angleLine1 || !angleLine2) return;

    let V = null, ang1 = 0, ang2 = 0, interiorAngle = 0, isCCW = true;

    if (angleLine1.shape.id === angleLine2.shape.id && angleLine1.shape.closed) {
        const s = angleLine1.shape;
        const n = s.pts.length;
        const idx1 = angleLine1.index;
        const idx2 = angleLine2.index;
        if ((idx1 + 1) % n === idx2 || (idx2 + 1) % n === idx1) {
            isCCW = getPolygonArea(s.pts) < 0;
            let prevIdx, nextIdx, vIdx;
            if ((idx1 + 1) % n === idx2) {
                prevIdx = idx1; vIdx = idx2; nextIdx = (idx2 + 1) % n;
            } else {
                prevIdx = idx2; vIdx = idx1; nextIdx = (idx1 + 1) % n;
            }
            const p0 = s.pts[prevIdx];
            V = s.pts[vIdx];
            const p2 = s.pts[nextIdx];
            ang1 = Math.atan2(p0.y - V.y, p0.x - V.x);
            ang2 = Math.atan2(p2.y - V.y, p2.x - V.x);
            
            let diff = isCCW ? (ang2 - ang1) : (ang1 - ang2);
            while (diff < 0) diff += Math.PI * 2;
            while (diff >= Math.PI * 2) diff -= Math.PI * 2;
            interiorAngle = diff;
        }
    }

    if (V === null) {
        V = getLineIntersection(angleLine1.p1, angleLine1.p2, angleLine2.p1, angleLine2.p2);
        if (V) {
            let aPt = (Math.hypot(angleLine1.p1.x - V.x, angleLine1.p1.y - V.y) > Math.hypot(angleLine1.p2.x - V.x, angleLine1.p2.y - V.y)) ? angleLine1.p1 : angleLine1.p2;
            let bPt = (Math.hypot(angleLine2.p1.x - V.x, angleLine2.p1.y - V.y) > Math.hypot(angleLine2.p2.x - V.x, angleLine2.p2.y - V.y)) ? angleLine2.p1 : angleLine2.p2;
            ang1 = Math.atan2(aPt.y - V.y, aPt.x - V.x);
            ang2 = Math.atan2(bPt.y - V.y, bPt.x - V.x);
            let diff = ang1 - ang2;
            while (diff <= -Math.PI) diff += Math.PI*2;
            while (diff > Math.PI) diff -= Math.PI*2;
            
            isCCW = false;
            if (diff < 0) {
                diff = -diff;
                let tmp = ang1; ang1 = ang2; ang2 = tmp;
            }
            interiorAngle = diff;
        }
    }

    if (!V) return;

    let currentCCW = isCCW;
    let displayAngle = interiorAngle;

    if (showExternalAngle) {
        currentCCW = !isCCW;
        displayAngle = Math.PI * 2 - interiorAngle;
    }

    const degrees = Math.round(displayAngle * 180 / Math.PI);
    const radius = showExternalAngle ? 45 : 35;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(V.x, V.y);
    ctx.arc(V.x, V.y, radius, ang2, ang1, currentCCW);
    ctx.fillStyle = showExternalAngle ? 'rgba(155, 89, 182, 0.4)' : 'rgba(255, 215, 0, 0.4)';
    ctx.fill();
    ctx.strokeStyle = showExternalAngle ? '#8e44ad' : '#e67e22';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    let midAngle;
    if (currentCCW) {
        let a1 = ang1;
        if (a1 > ang2) a1 -= Math.PI * 2;
        midAngle = ang2 + (a1 - ang2) / 2;
    } else {
        let a1 = ang1;
        if (a1 < ang2) a1 += Math.PI * 2;
        midAngle = ang2 + (a1 - ang2) / 2;
    }

    const tx = V.x + Math.cos(midAngle) * (radius + 20);
    const ty = V.y + Math.sin(midAngle) * (radius + 20);

    ctx.font = 'bold 18px "Comic Sans MS", "Chalkboard SE", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'white';
    ctx.fillText(degrees + '°', tx-1.5, ty-1.5);
    ctx.fillText(degrees + '°', tx+1.5, ty+1.5);
    ctx.fillText(degrees + '°', tx+1.5, ty-1.5);
    ctx.fillText(degrees + '°', tx-1.5, ty+1.5);
    ctx.fillStyle = showExternalAngle ? '#8e44ad' : '#d35400';
    ctx.fillText(degrees + '°', tx, ty);
    ctx.restore();
}

function drawProtractorOverlay() {
    if (!protractor.active) return;
    const { cx, cy, angle, r } = protractor;
    
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    
    // Semicírculo base
    ctx.beginPath();
    ctx.arc(0, 0, r, Math.PI, 0, false);
    ctx.lineTo(r + 10, 0);
    ctx.lineTo(-r - 10, 0);
    ctx.closePath();
    ctx.fillStyle = 'rgba(236, 240, 241, 0.75)'; // Light gray, translucent
    ctx.fill();
    
    ctx.beginPath();
    ctx.arc(0, 0, r, Math.PI, 0, false);
    ctx.lineTo(r, 0);
    ctx.lineTo(-r, 0);
    ctx.closePath();
    ctx.strokeStyle = '#34495e';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Marcas de grados
    ctx.fillStyle = '#2c3e50';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '10px Arial';
    
    for (let i = 0; i <= 180; i++) {
        const rad = (i + 180) * Math.PI / 180;
        const x1 = Math.cos(rad) * r;
        const y1 = Math.sin(rad) * r;
        let lineLength = 5;
        
        if (i % 10 === 0) {
            lineLength = 15;
            const tx = Math.cos(rad) * (r - 22);
            const ty = Math.sin(rad) * (r - 22);
            ctx.save();
            ctx.translate(tx, ty);
            ctx.rotate(rad + Math.PI/2);
            ctx.fillText(i.toString(), 0, 0);
            ctx.restore();
        } else if (i % 5 === 0) {
            lineLength = 10;
        }
        
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(Math.cos(rad) * (r - lineLength), Math.sin(rad) * (r - lineLength));
        ctx.strokeStyle = '#34495e';
        ctx.lineWidth = i % 10 === 0 ? 2 : 1;
        ctx.stroke();
    }
    
    // Centro (Move Handle)
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI*2);
    ctx.fillStyle = '#e74c3c';
    ctx.fill();
    ctx.strokeStyle = '#c0392b';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Eje base (0 grados) - Asa de rotación
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(r, 0);
    ctx.strokeStyle = '#2ecc71';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(r, 0, 10, 0, Math.PI*2);
    ctx.fillStyle = '#2ecc71';
    ctx.fill();
    ctx.strokeStyle = '#27ae60';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    ctx.restore();
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid();

    if (activeTangram !== 'none' && tangramPaths[activeTangram]) {
        ctx.save();
        ctx.fillStyle = '#e0e0e0';
        ctx.strokeStyle = '#cccccc';
        ctx.lineWidth = 2;
        tangramPaths[activeTangram].forEach(poly => {
            ctx.beginPath();
            poly.pts.forEach((p, i) => {
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        });
        ctx.restore();
    }

    const selectedList = Array.from(selectedIds);
    shapes.forEach(s => {
        if (s.type === 'poly')   drawPoly(s, selectedIds.has(s.id));
        if (s.type === 'circle') drawCircShape(s, selectedIds.has(s.id));
    });
    drawInProgress();
    if (symmetryAxis) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(symmetryAxis.p1.x, symmetryAxis.p1.y);
        ctx.lineTo(symmetryAxis.p2.x, symmetryAxis.p2.y);
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 3;
        ctx.setLineDash([10, 10]);
        ctx.stroke();
        ctx.restore();
    }

    if (mode === 'angle') {
        drawSelectedAngle();
    }

    if (selectBoxStart && selectBoxEnd) {
        ctx.save();
        const bMinX = Math.min(selectBoxStart.x, selectBoxEnd.x);
        const bMinY = Math.min(selectBoxStart.y, selectBoxEnd.y);
        const w = Math.abs(selectBoxEnd.x - selectBoxStart.x);
        const h = Math.abs(selectBoxEnd.y - selectBoxStart.y);
        
        ctx.fillStyle = 'rgba(52, 152, 219, 0.15)';
        ctx.fillRect(bMinX, bMinY, w, h);
        ctx.strokeStyle = '#3498db';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(bMinX, bMinY, w, h);
        ctx.restore();
    }

    if (mode === 'translate' && translateStart && translateEnd) {
        ctx.save();
        const dx = translateEnd.x - translateStart.x;
        const dy = translateEnd.y - translateStart.y;
        
        // Dibujar vector
        ctx.beginPath();
        ctx.moveTo(translateStart.x, translateStart.y);
        ctx.lineTo(translateEnd.x, translateEnd.y);
        ctx.strokeStyle = '#e74c3c';
        ctx.lineWidth = 4;
        ctx.stroke();
        
        // Flecha
        const angle = Math.atan2(dy, dx);
        ctx.beginPath();
        ctx.moveTo(translateEnd.x, translateEnd.y);
        ctx.lineTo(translateEnd.x - 15 * Math.cos(angle - Math.PI/6), translateEnd.y - 15 * Math.sin(angle - Math.PI/6));
        ctx.lineTo(translateEnd.x - 15 * Math.cos(angle + Math.PI/6), translateEnd.y - 15 * Math.sin(angle + Math.PI/6));
        ctx.closePath();
        ctx.fillStyle = '#e74c3c';
        ctx.fill();

        // Dibujar ghost de las figuras trasladadas
        if (dragSnapshot && (dx !== 0 || dy !== 0)) {
            ctx.globalAlpha = 0.4;
            dragSnapshot.forEach(item => {
                if (item.type === 'poly') {
                    ctx.beginPath();
                    if (item.pts.length > 0) {
                        ctx.moveTo(item.pts[0].x + dx, item.pts[0].y + dy);
                        item.pts.forEach(p => ctx.lineTo(p.x + dx, p.y + dy));
                        if (item.closed) ctx.closePath();
                        ctx.fillStyle = item.color;
                        ctx.fill();
                        ctx.strokeStyle = '#2c3e50';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                } else if (item.type === 'circle') {
                    ctx.beginPath();
                    ctx.arc(item.cx + dx, item.cy + dy, item.r, 0, Math.PI*2);
                    ctx.fillStyle = item.color;
                    ctx.fill();
                    ctx.strokeStyle = '#2c3e50';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });
        }
        ctx.restore();
    }

    drawProtractorOverlay();

    const isIso = document.getElementById('gridSelect').value === 'iso';
    const btn3d = document.getElementById('btn3D');
    
    if (isIso) {
        btn3d.disabled = true;
        btn3d.title = "¡Modo Isométrico! Tú eres el creador del volumen. Dibuja el 3D a mano.";
    } else {
        btn3d.disabled = selectedIds.size === 0;
        btn3d.title = "Ver en 3D (selecciona una figura primero)";
    }

    const disableRotate = selectedIds.size !== 1;
    const btnRotateMenuToggle = document.getElementById('btnRotateMenuToggle');
    if (btnRotateMenuToggle) {
        btnRotateMenuToggle.disabled = disableRotate;
        if (disableRotate) document.getElementById('rotateMenu').style.display = 'none';
    }

    const btnCut = document.getElementById('btnCut');
    if (btnCut) {
        btnCut.disabled = selectedIds.size !== 1;
        if (selectedIds.size !== 1) document.getElementById('cutMenu').style.display = 'none';
    }
    
    // Toggle banner de dibujo
    const drawBanner = document.getElementById('drawBanner');
    if (drawBanner) {
        drawBanner.style.display = (mode === 'draw' && drawPts.length > 0) ? 'flex' : 'none';
    }

    document.getElementById('shapeCount').textContent = shapes.length;
    document.getElementById('selLabel').textContent = selectedList.length
        ? `Sel: ${selectedList.join(', ')}`
        : 'ninguna';

    const mirrorBanner = document.getElementById('mirrorBanner');
    if (mirrorBanner) {
        mirrorBanner.style.display = symmetryAxis ? 'flex' : 'none';
    }
}

// ──────────────────────────────────────────────────────────────────
//  EVENTOS Y LOGICA
// ──────────────────────────────────────────────────────────────────
function getPos(e) {
    const r  = canvas.getBoundingClientRect();
    const sx = canvas.width / r.width, sy = canvas.height / r.height;
    const src = (e.touches ? e.touches[0] || e.changedTouches[0] : e);
    return { px:(src.clientX-r.left)*sx, py:(src.clientY-r.top)*sy };
}

function ptInPoly(px, py, pts) {
    let inside = false;
    for (let i=0, j=pts.length-1; i<pts.length; j=i++) {
        const {x:xi,y:yi}=pts[i], {x:xj,y:yj}=pts[j];
        if (((yi>py)!==(yj>py)) && (px<(xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;
    }
    return inside;
}

// Distancia punto-segmento
function distPtSeg(px,py, ax,ay, bx,by) {
    const dx=bx-ax, dy=by-ay;
    const len2=dx*dx+dy*dy;
    if (len2===0) return Math.hypot(px-ax,py-ay);
    const t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/len2));
    return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
}

// Encontrar figura bajo cursor (para goma / mover)
function findEdgeAt(px, py) {
    const HIT = 10;
    for (let i = shapes.length - 1; i >= 0; i--) {
        const s = shapes[i];
        if (s.type === 'poly' && s.pts.length >= 2) {
            for (let j = 0; j < s.pts.length; j++) {
                if (!s.closed && j === s.pts.length - 1) continue;
                const p1 = s.pts[j];
                const p2 = s.pts[(j + 1) % s.pts.length];
                if (distPtSeg(px, py, p1.x, p1.y, p2.x, p2.y) < HIT) {
                    return { shape: s, index: j, p1: p1, p2: p2 };
                }
            }
        }
    }
    return null;
}

function findAt(px, py) {
    const HIT = 14; // tolerancia px para bordes
    for (let i=shapes.length-1; i>=0; i--) {
        const s = shapes[i];
        if (s.type === 'circle') {
            const d = Math.hypot(px-s.cx, py-s.cy);
            if (d <= s.r+HIT) return s;
        }
        if (s.type === 'poly') {
            if (s.closed && ptInPoly(px,py,s.pts)) return s;
            // bordes
            for (let j=0; j<s.pts.length-1; j++) {
                if (distPtSeg(px,py, s.pts[j].x,s.pts[j].y, s.pts[j+1].x,s.pts[j+1].y) < HIT) return s;
            }
            if (s.closed && s.pts.length>2) {
                const last=s.pts[s.pts.length-1], first=s.pts[0];
                if (distPtSeg(px,py, last.x,last.y, first.x,first.y) < HIT) return s;
            }
        }
    }
    return null;
}

function closeFigure() {
    if (drawPts.length < 3) {
        cancelFigure();
        return;
    }
    shapes.push({ id:nextId++, type:'poly', pts:[...drawPts], closed:true, color:currentColor });
    const origShape = shapes[shapes.length-1];
    
    if (symmetryAxis) {
        const refPts = drawPts.map(p => reflectPoint(p.x, p.y, symmetryAxis));
        refPts.reverse(); // Mantener el orden CCW para el cálculo de área y 3D
        shapes.push({ id:nextId++, type:'poly', pts:refPts, closed:true, color:currentColor });
    }
    
    selectedIds = new Set([origShape.id]);
    drawPts = [];
    checkChallenge(origShape);
    render();
}

function cancelFigure() {
    drawPts = [];
    document.getElementById('drawBanner').style.display = 'none';
    render();
}

function finishOpenFigure() {
    if (drawPts.length < 2) {
        cancelFigure();
        return;
    }
    shapes.push({ id:nextId++, type:'poly', pts:[...drawPts], closed:false, color:currentColor });
    const origShape = shapes[shapes.length-1];
    
    if (symmetryAxis) {
        const refPts = drawPts.map(p => reflectPoint(p.x, p.y, symmetryAxis));
        // No revertimos el array porque las líneas abiertas no tienen relleno
        shapes.push({ id:nextId++, type:'poly', pts:refPts, closed:false, color:currentColor });
    }

    selectedIds = new Set([origShape.id]);
    drawPts = [];
    render();
}

function cloneShape(shape) {
    return JSON.parse(JSON.stringify(shape));
}

function getSelectedShapeIds() {
    return Array.from(selectedIds);
}

function getSelectedShapes() {
    return shapes.filter(shape => selectedIds.has(shape.id));
}

function sameSegment(a, b) {
    return (a.x === b.x && a.y === b.y && a.x2 === b.x2 && a.y2 === b.y2) ||
           (a.x === b.x2 && a.y === b.y2 && a.x2 === b.x && a.y2 === b.y);
}

function getEdges(shape) {
    if (shape.type !== 'poly' || !shape.closed || shape.pts.length < 2) return [];
    return shape.pts.map((p, i) => {
        const q = shape.pts[(i + 1) % shape.pts.length];
        return { x: p.x, y: p.y, x2: q.x, y2: q.y };
    });
}

function shapesShareEdge(a, b) {
    if (a.type !== 'poly' || b.type !== 'poly' || !a.closed || !b.closed) return false;
    const aEdges = getEdges(a);
    const bEdges = getEdges(b);
    return aEdges.some(e1 => bEdges.some(e2 => sameSegment(e1, e2)));
}

function findConnectedGroup(startShape) {
    const visited = new Set([startShape.id]);
    const queue = [startShape];

    while (queue.length) {
        const current = queue.shift();
        shapes.forEach(other => {
            if (other.id === current.id || visited.has(other.id)) return;
            if (shapesShareEdge(current, other)) {
                visited.add(other.id);
                queue.push(other);
            }
        });
    }

    return shapes.filter(shape => visited.has(shape.id));
}

function setMultiSelect(on) {
    multiSelectEnabled = !!on;
    document.getElementById('btnMulti').classList.toggle('active', multiSelectEnabled);
    document.getElementById('modeLabel').textContent = multiSelectEnabled ? '🧩 Selección múltiple' : '👆 Mover';
}

function toggleSelection(id) {
    if (selectedIds.has(id)) selectedIds.delete(id);
    else selectedIds.add(id);
}

function clipPolygon(subjectPoly, clipPoly) {
    let outputList = subjectPoly;
    for (let i = 0; i < clipPoly.length; i++) {
        const cp1 = clipPoly[i], cp2 = clipPoly[(i + 1) % clipPoly.length];
        const inputList = outputList;
        outputList = [];
        if (inputList.length === 0) break;
        let s = inputList[inputList.length - 1];
        for (let j = 0; j < inputList.length; j++) {
            const e = inputList[j];
            const isInside = p => (cp2.x - cp1.x) * (p.y - cp1.y) - (cp2.y - cp1.y) * (p.x - cp1.x) >= -0.001;
            const computeIntersection = () => {
                const dcx = cp1.x - cp2.x, dcy = cp1.y - cp2.y, dsx = s.x - e.x, dsy = s.y - e.y;
                const nom = (cp1.x*cp2.y - cp1.y*cp2.x), nom2 = (s.x*e.y - s.y*e.x);
                const denom = dcx*dsy - dcy*dsx;
                if (Math.abs(denom) < 0.0001) return s;
                return { x: (nom*dsx - dcx*nom2)/denom, y: (nom*dsy - dcy*nom2)/denom };
            };
            if (isInside(e)) {
                if (!isInside(s)) outputList.push(computeIntersection());
                outputList.push(e);
            } else if (isInside(s)) outputList.push(computeIntersection());
            s = e;
        }
    }
    return outputList;
}

function cutShape(shape, n, isIrregular = false) {
    const pieces = [];
    const colors = ['#FFC3A0', '#FF677D', '#D4A5A5', '#A2D5F2', '#87D0A5', '#F0E5D2', '#ffb26b', '#9b59b6'];
    const cx = shape.type === 'circle' ? shape.cx : shape.pts.reduce((sum, p) => sum + p.x, 0) / shape.pts.length;
    const cy = shape.type === 'circle' ? shape.cy : shape.pts.reduce((sum, p) => sum + p.y, 0) / shape.pts.length;
    
    let angles = [];
    if (isIrregular) {
        let weights = [];
        for (let i = 0; i < n; i++) weights.push(0.5 + Math.random() * 1.5);
        const totalW = weights.reduce((a,b) => a+b, 0);
        angles = weights.map(w => w * 2 * Math.PI / totalW);
    } else {
        for (let i = 0; i < n; i++) angles.push(2 * Math.PI / n);
    }
    
    let currentAngle = 0;
    
    for (let i = 0; i < n; i++) {
        const a1 = currentAngle;
        const a2 = currentAngle + angles[i];
        currentAngle = a2;
        const bisector = a1 + (a2 - a1) / 2;
        const offset = 8;
        const dx = Math.cos(bisector) * offset;
        const dy = Math.sin(bisector) * offset;
        const col = colors[i % colors.length];

        if (shape.type === 'circle') {
            const pts = [{x: cx + dx, y: cy + dy}];
            const steps = Math.max(3, Math.floor(20 / n));
            for (let j = 0; j <= steps; j++) {
                const a = a1 + (a2 - a1) * j / steps;
                pts.push({x: cx + Math.cos(a)*shape.r + dx, y: cy + Math.sin(a)*shape.r + dy});
            }
            pieces.push({ id: nextId++, type: 'poly', pts: pts, closed: true, color: col });
        } else {
            const BIG = 20000;
            // Para n=2, un triángulo con cx,cy y dos puntos opuestos es colineal (área 0).
            // Añadir el punto bisectriz crea un polígono convexo válido que envuelve todo el sector.
            const clipShape = [
                {x: cx, y: cy},
                {x: cx + Math.cos(a1)*BIG, y: cy + Math.sin(a1)*BIG},
                {x: cx + Math.cos(bisector)*BIG, y: cy + Math.sin(bisector)*BIG},
                {x: cx + Math.cos(a2)*BIG, y: cy + Math.sin(a2)*BIG}
            ];
            const clipped = clipPolygon(shape.pts, clipShape);
            if (clipped.length >= 3) {
                const movedPts = clipped.map(p => ({ x: p.x + dx, y: p.y + dy }));
                pieces.push({ id: nextId++, type: 'poly', pts: movedPts, closed: true, color: col });
            }
        }
    }
    return pieces;
}

// ──────────────────────────────────────────────────────────────────
//  EVENTOS CANVAS
// ──────────────────────────────────────────────────────────────────
function reflectPoint(x, y, axis) {
    if (!axis) return {x, y};
    const {p1, p2} = axis;
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    if (dx === 0 && dy === 0) return {x, y};
    const a = (dx*dx - dy*dy) / (dx*dx + dy*dy);
    const b = 2 * dx * dy / (dx*dx + dy*dy);
    const nx = a * (x - p1.x) + b * (y - p1.y) + p1.x;
    const ny = b * (x - p1.x) - a * (y - p1.y) + p1.y;
    return {x: nx, y: ny};
}

function onDown(e) {
    e.preventDefault();
    const { px, py } = getPos(e);
    const snap = snapToGrid(px, py);

    if (protractor.active) {
        const rotX = protractor.cx + protractor.r * Math.cos(protractor.angle);
        const rotY = protractor.cy + protractor.r * Math.sin(protractor.angle);
        if (Math.hypot(px - rotX, py - rotY) < 25) {
            dragProtractorMode = 'rotate';
            return;
        }
        if (Math.hypot(px - protractor.cx, py - protractor.cy) < 25) {
            dragProtractorMode = 'move';
            return;
        }
    }

    if (mode === 'translate') {
        if (getSelectedShapeIds().length === 0) {
            const s = findAt(px, py);
            if (s) {
                selectedIds = new Set([s.id]);
            }
        } else {
            translateStart = snap;
            translateEnd = snap;
            dragSnapshot = getSelectedShapeIds().map(id => cloneShape(shapes.find(shape => shape.id === id)));
        }
        render();
        return;
    }

    if (mode === 'symmetry') {
        symmetryDrawStart = snap;
        symmetryAxis = null;
        render();
        return;
    }

    if (mode === 'draw') {
        if (drawPts.length >= 3 &&
            Math.hypot(snap.x-drawPts[0].x, snap.y-drawPts[0].y) < SNAP_DIST) {
            closeFigure(); return;
        }
        if (drawPts.length > 0 &&
            snap.x===drawPts[drawPts.length-1].x && snap.y===drawPts[drawPts.length-1].y) return;
        drawPts.push(snap);
        render();
        return;
    }

    if (mode === 'circle') {
        circDraw  = true;
        circStart = snap;
        circPrev  = 0;
        render();
        return;
    }

    if (mode === 'eraser') {
        const s = findAt(px, py);
        if (s) {
            shapes = shapes.filter(sh => sh.id !== s.id);
            selectedIds.delete(s.id);
            eraserHover = null;
        }
        render();
        return;
    }

    if (mode === 'angle') {
        const edge = findEdgeAt(px, py);
        if (edge) {
            if (!angleLine1) {
                angleLine1 = edge;
            } else if (!angleLine2 && !sameEdge(angleLine1, edge)) {
                angleLine2 = edge;
                const btn = document.getElementById('btnAngleToggle');
                btn.style.display = 'inline-block';
            } else {
                angleLine1 = edge;
                angleLine2 = null;
                showExternalAngle = false;
                document.getElementById('btnAngleToggle').style.display = 'none';
            }
        } else {
            angleLine1 = null;
            angleLine2 = null;
            showExternalAngle = false;
            document.getElementById('btnAngleToggle').style.display = 'none';
        }
        render();
        return;
    }

    if (mode === 'move') {
        const s = findAt(px, py);
        if (s) {
            if (multiSelectEnabled) {
                if (selectedIds.has(s.id)) {
                    selectedIds.delete(s.id);
                } else {
                    selectedIds.add(s.id);
                }
            } else {
                selectedIds = new Set([s.id]);
            }
            dragId = s.id;
            dragStart = snapToGrid(px, py);
            dragSnapshot = getSelectedShapeIds().map(id => cloneShape(shapes.find(shape => shape.id === id)));
        } else {
            if (!multiSelectEnabled) selectedIds = new Set();
            dragSnapshot = null;
            dragStart = null;
            selectBoxStart = { x: px, y: py };
            selectBoxEnd = { x: px, y: py };
        }
        render();
    }
}

function onMove(e) {
    e.preventDefault();
    const { px, py } = getPos(e);

    // Bug 9: No procesar ni repintar si el cursor está fuera del canvas
    if (px < 0 || py < 0 || px > canvas.width || py > canvas.height) return;

    hoverSnap = snapToGrid(px, py);

    if (dragProtractorMode === 'move') {
        protractor.cx = px;
        protractor.cy = py;
        render(); return;
    }
    if (dragProtractorMode === 'rotate') {
        protractor.angle = Math.atan2(py - protractor.cy, px - protractor.cx);
        // Snap a 5 grados libremente para uso infantil si lo desean, o contínuo
        render(); return;
    }

    if (mode === 'translate' && translateStart) {
        translateEnd = snapToGrid(px, py);
        render(); return;
    }

    if (mode === 'symmetry' && symmetryDrawStart) {
        symmetryAxis = {p1: symmetryDrawStart, p2: hoverSnap};
        render();
        return;
    }

    if (mode === 'circle' && circDraw && circStart) {
        circPrev = Math.hypot(px-circStart.x, py-circStart.y);
        render(); return;
    }

    if (mode === 'eraser') {
        const s = findAt(px, py);
        eraserHover = s ? s.id : null;
        render(); return;
    }

    if (mode === 'angle') {
        angleHoverLine = findEdgeAt(px, py);
        render(); return;
    }

    if (mode === 'move') {
        if (dragSnapshot && dragStart) {
            const current = snapToGrid(px, py);
            const dx = current.x - dragStart.x;
            const dy = current.y - dragStart.y;

            getSelectedShapeIds().forEach(id => {
                const original = dragSnapshot.find(item => item.id === id);
                const shape = shapes.find(item => item.id === id);
                if (!original || !shape) return;

                if (shape.type === 'poly') {
                    shape.pts = original.pts.map(point => ({ x: point.x + dx, y: point.y + dy }));
                } else {
                    shape.cx = original.cx + dx;
                    shape.cy = original.cy + dy;
                }
            });
            render();
            return;
        } else if (selectBoxStart) {
            selectBoxEnd = { x: px, y: py };
            render();
            return;
        }
    }
    render();
}

function onUp(e) {
    e.preventDefault(); // Bug 10: evitar eventos fantasma en touch
    const { px, py } = getPos(e);

    if (dragProtractorMode) {
        dragProtractorMode = null;
        render(); return;
    }

    if (mode === 'translate' && translateStart && translateEnd) {
        const dx = translateEnd.x - translateStart.x;
        const dy = translateEnd.y - translateStart.y;
        
        if (dx !== 0 || dy !== 0) {
            getSelectedShapeIds().forEach(id => {
                const shape = shapes.find(item => item.id === id);
                if (!shape) return;
                if (shape.type === 'poly') {
                    shape.pts.forEach(point => { point.x += dx; point.y += dy; });
                } else {
                    shape.cx += dx; shape.cy += dy;
                }
            });
        }
        translateStart = null;
        translateEnd = null;
        dragSnapshot = null;
        render(); return;
    }

    if (mode === 'symmetry' && symmetryDrawStart) {
        const snap = snapToGrid(px, py);
        symmetryAxis = {p1: symmetryDrawStart, p2: snap};
        if (symmetryAxis.p1.x === symmetryAxis.p2.x && symmetryAxis.p1.y === symmetryAxis.p2.y) {
            symmetryAxis = null;
        }
        symmetryDrawStart = null;
        render();
        return;
    }

    if (mode === 'circle' && circDraw && circStart) {
        const r = Math.hypot(px-circStart.x, py-circStart.y);
        if (r >= 10) {
            const snapR = Math.max(CM/2, Math.round(r/(CM/2))*(CM/2));
            shapes.push({ id:nextId++, type:'circle', cx:circStart.x, cy:circStart.y, r:snapR, color:currentColor });
            const origShape = shapes[shapes.length-1];
            if (symmetryAxis) {
                const rp = reflectPoint(circStart.x, circStart.y, symmetryAxis);
                shapes.push({ id:nextId++, type:'circle', cx:rp.x, cy:rp.y, r:snapR, color:currentColor });
            }
            selectedIds = new Set([origShape.id]);
            checkChallenge(origShape);
        }
        circDraw=false; circStart=null; circPrev=0;
    }

    if (mode === 'move' && selectBoxStart && selectBoxEnd) {
        const bMinX = Math.min(selectBoxStart.x, selectBoxEnd.x);
        const bMaxX = Math.max(selectBoxStart.x, selectBoxEnd.x);
        const bMinY = Math.min(selectBoxStart.y, selectBoxEnd.y);
        const bMaxY = Math.max(selectBoxStart.y, selectBoxEnd.y);

        if (bMaxX - bMinX > 5 || bMaxY - bMinY > 5) {
            shapes.forEach(shape => {
                let intersect = false;
                if (shape.type === 'circle') {
                    const cMinX = shape.cx - shape.r, cMaxX = shape.cx + shape.r;
                    const cMinY = shape.cy - shape.r, cMaxY = shape.cy + shape.r;
                    intersect = !(cMinX > bMaxX || cMaxX < bMinX || cMinY > bMaxY || cMaxY < bMinY);
                } else {
                    let pMinX = Infinity, pMaxX = -Infinity, pMinY = Infinity, pMaxY = -Infinity;
                    shape.pts.forEach(p => {
                        pMinX = Math.min(pMinX, p.x); pMaxX = Math.max(pMaxX, p.x);
                        pMinY = Math.min(pMinY, p.y); pMaxY = Math.max(pMaxY, p.y);
                    });
                    intersect = !(pMinX > bMaxX || pMaxX < bMinX || pMinY > bMaxY || pMaxY < bMinY);
                }
                if (intersect) {
                    selectedIds.add(shape.id);
                }
            });
            
            // Activar automáticamente el modo multi-selección si encerró varias figuras
            if (selectedIds.size > 1 && !multiSelectEnabled) {
                setMultiSelect(true);
            }
        }
        selectBoxStart = null;
        selectBoxEnd = null;
    }

    dragId=null;
    dragStart = null;
    dragSnapshot = null;
    render();
}

function doRotate(dir) {
    const selIds = getSelectedShapeIds();
    if (selIds.length === 1) {
        const shape = shapes.find(s => s.id === selIds[0]);
        if (shape && shape.type === 'poly') {
            const axis = document.getElementById('rotateAxis').value;
            let cx = 0, cy = 0;
            
            if (axis === 'origin') {
                cx = OFF + Math.floor(COLS/2)*CM;
                cy = OFF + Math.floor(ROWS/2)*CM;
            } else if (axis === 'v_custom') {
                const pIdx = shape.pivotIdx || 0;
                cx = shape.pts[pIdx].x;
                cy = shape.pts[pIdx].y;
            } else {
                // center
                cx = shape.pts.reduce((sum, p) => sum + p.x, 0) / shape.pts.length;
                cy = shape.pts.reduce((sum, p) => sum + p.y, 0) / shape.pts.length;
            }
            
            const degree = parseFloat(document.getElementById('rotateAngle').value) || 15;
            const angle = dir * degree * Math.PI / 180;
            const cosA = Math.cos(angle);
            const sinA = Math.sin(angle);
            shape.pts.forEach(p => {
                const dx = p.x - cx;
                const dy = p.y - cy;
                p.x = cx + dx * cosA - dy * sinA;
                p.y = cy + dx * sinA + dy * cosA;
            });
            render();
        }
    }
}

function read3DOptions() {

function themeColor(theme) {
    if (theme === 'light') return { bg: 0xf6f8ff, floor: 0xe4e9f8, grid: 0xaec2ea, accent: 0x4d5dff };
    if (theme === 'neon') return { bg: 0x08111f, floor: 0x102238, grid: 0x1fa7ff, accent: 0xffd166 };
    return { bg: 0x0a0a1a, floor: 0x111122, grid: 0x3355cc, accent: 0xffee88 };
}

function getShapeCenter(shape) {
    if (shape.type === 'circle') return { x: shape.cx, y: shape.cy };
    const pts = shape.pts || [];
    const cx = pts.reduce((sum, p) => sum + p.x, 0) / pts.length;
    const cy = pts.reduce((sum, p) => sum + p.y, 0) / pts.length;
    return { x: cx, y: cy };
}

function createThickEdges(geometry, colorObj, thickness) {
    const edgesGeo = new THREE.EdgesGeometry(geometry);
    const pos = edgesGeo.attributes.position.array;
    const group = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: colorObj, roughness: 0.8, metalness: 0.1 });
    const vecY = new THREE.Vector3(0, 1, 0);
    const sphereGeo = new THREE.SphereGeometry(thickness, 8, 8);
    
    for (let i = 0; i < pos.length; i += 6) {
        const p1 = new THREE.Vector3(pos[i], pos[i+1], pos[i+2]);
        const p2 = new THREE.Vector3(pos[i+3], pos[i+4], pos[i+5]);
        const dist = p1.distanceTo(p2);
        
        const cylGeo = new THREE.CylinderGeometry(thickness, thickness, dist, 8);
        const cyl = new THREE.Mesh(cylGeo, mat);
        
        cyl.position.copy(p1).lerp(p2, 0.5);
        cyl.quaternion.setFromUnitVectors(vecY, p2.clone().sub(p1).normalize());
        
        group.add(cyl);
        
        const s1 = new THREE.Mesh(sphereGeo, mat);
        s1.position.copy(p1);
        group.add(s1);
        
        const s2 = new THREE.Mesh(sphereGeo, mat);
        s2.position.copy(p2);
        group.add(s2);
    }
    return group;
}

async function show3D() {
    const selected = getSelectedShapes();
    if (!selected.length) { alert('🌟 Selecciona una o varias figuras primero (modo Mover).'); return; }

    const invalid = selected.some(shape => shape.type === 'poly' && shape.pts.length < 3);
    if (invalid) { alert('Cada figura poligonal necesita al menos 3 puntos para verse en 3D.'); return; }

    // Bug 3: Reiniciar foldHinges al inicio para evitar acumulación
    foldHinges = [];

    const modal=document.getElementById('modal3d'), wrap=document.getElementById('c3dWrap');
    wrap.innerHTML=''; modal.style.display='flex';
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

    const options = read3DOptions();
    const W=wrap.clientWidth||720, H=wrap.clientHeight||460;

    const scene=new THREE.Scene();
    const theme = themeColor(options.theme);
    scene.background=new THREE.Color(theme.bg);

    const cam=new THREE.PerspectiveCamera(45,W/H,0.1,300);
    // Posicionamos la cámara más frontalmente para apreciar las figuras "de pie"
    cam.position.set(0, 2, 22);
    cam.lookAt(0,0,0);

    rend3d=new THREE.WebGLRenderer({antialias:true});
    rend3d.setSize(W,H); rend3d.setPixelRatio(devicePixelRatio||1);
    rend3d.shadowMap.enabled=true;
    wrap.appendChild(rend3d.domElement);

    const ctrl=new OrbitControls(cam,rend3d.domElement);
    ctrl.enableDamping=true; ctrl.autoRotate=options.autoRotate; ctrl.autoRotateSpeed=2;

    scene.add(new THREE.AmbientLight(0x334466,1.4));
    const sun=new THREE.DirectionalLight(0xffffff,2.3);
    sun.position.set(6,10,7); sun.castShadow=true; scene.add(sun);
    const rim=new THREE.PointLight(0xaaccff,1.1); rim.position.set(-5,3,-5); scene.add(rim);

    const group=new THREE.Group();
    scene.add(group);

    const palette = [0xff8c42, 0x56c596, 0x6d8cff, 0xff5a7c, 0xffd166, 0x7bf1a8, 0x9b5de5, 0x00b4d8];

    // 1. Calcular el centro global y la dimensión máxima para el grosor unificado
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    let maxShapeSize = 0; // Para calcular el grosor unificado de bloque

    selected.forEach(s => {
        if (s.type === 'circle') {
            minX = Math.min(minX, s.cx - s.r); maxX = Math.max(maxX, s.cx + s.r);
            minY = Math.min(minY, s.cy - s.r); maxY = Math.max(maxY, s.cy + s.r);
            maxShapeSize = Math.max(maxShapeSize, s.r * 2);
        } else {
            let sMinX = Infinity, sMaxX = -Infinity, sMinY = Infinity, sMaxY = -Infinity;
            s.pts.forEach(p => {
                minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
                minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
                
                sMinX = Math.min(sMinX, p.x); sMaxX = Math.max(sMaxX, p.x);
                sMinY = Math.min(sMinY, p.y); sMaxY = Math.max(sMaxY, p.y);
            });
            maxShapeSize = Math.max(maxShapeSize, sMaxX - sMinX, sMaxY - sMinY);
        }
    });
    const globalCx = (minX + maxX) / 2;
    const globalCy = (minY + maxY) / 2;
    
    // Convertir el tamaño máximo a coordenadas 3D para la extrusión
    const unifiedDepth = (options.depth / 20) * (maxShapeSize / CM) * options.scale;

    if (options.foldMode && selected.every(s => s.type === 'poly')) {
        const nodes = selected.map(s => ({ shape: s, edges: getEdges(s), neighbors: [], visited: false, mesh: null }));
        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
                const sharedEdge = nodes[i].edges.find(e1 => nodes[j].edges.some(e2 => sameSegment(e1, e2)));
                if (sharedEdge) {
                    nodes[i].neighbors.push({ node: nodes[j], edge: sharedEdge });
                    nodes[j].neighbors.push({ node: nodes[i], edge: sharedEdge });
                }
            }
        }
        
        nodes.forEach(root => {
            if (root.visited) return;
            const queue = [{ node: root, parentMesh: group, hingeEdge: null }];
            root.visited = true;
            
            while (queue.length > 0) {
                const { node, parentMesh, hingeEdge } = queue.shift();
                const shape = node.shape;
                const colNum = parseInt(shape.color.replace('#',''), 16);
                const matFace = new THREE.MeshStandardMaterial({color: colNum, roughness: 0.25, metalness: 0.18, side: THREE.DoubleSide});
                
                const pts = shape.pts;
                const norm = pts.map(p => ({ x: (p.x - globalCx)/CM * options.scale, y: -(p.y - globalCy)/CM * options.scale }));
                let area = 0;
                for (let i=0; i<norm.length; i++) {
                    const p1=norm[i], p2=norm[(i+1)%norm.length];
                    area += (p1.x*p2.y) - (p2.x*p1.y);
                }
                const ordered = area < 0 ? [...norm].reverse() : norm;
                const tsh = new THREE.Shape();
                tsh.moveTo(ordered[0].x, ordered[0].y);
                ordered.slice(1).forEach(p => tsh.lineTo(p.x, p.y));
                tsh.closePath();
                
                const geo = new THREE.ExtrudeGeometry(tsh, { depth: 0.05, bevelEnabled: false });
                const mesh = new THREE.Mesh(geo, matFace);
                mesh.castShadow = true; mesh.receiveShadow = true;
                node.mesh = mesh;
                
                if (options.showWireframe) {
                    const edgeColor = new THREE.Color(colNum).lerp(new THREE.Color(0x000000), 0.6);
                    mesh.add(createThickEdges(mesh.geometry, edgeColor, 0.04));
                }
                
                if (hingeEdge) {
                    const ex1 = (hingeEdge.x - globalCx)/CM * options.scale;
                    const ey1 = -(hingeEdge.y - globalCy)/CM * options.scale;
                    const ex2 = (hingeEdge.x2 - globalCx)/CM * options.scale;
                    const ey2 = -(hingeEdge.y2 - globalCy)/CM * options.scale;
                    
                    const edgeCenter = new THREE.Vector3((ex1+ex2)/2, (ey1+ey2)/2, 0);
                    const edgeDir = new THREE.Vector3(ex2-ex1, ey2-ey1, 0).normalize();
                    
                    const hingeBase = new THREE.Group();
                    hingeBase.position.copy(edgeCenter);
                    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1,0,0), edgeDir);
                    hingeBase.quaternion.copy(q);
                    
                    const hingePivot = new THREE.Group();
                    hingeBase.add(hingePivot);
                    
                    const invQ = q.clone().invert();
                    const meshPos = edgeCenter.clone().negate().applyQuaternion(invQ);
                    
                    mesh.position.copy(meshPos);
                    mesh.quaternion.copy(invQ);
                    
                    const childCx = pts.reduce((a,p)=>a+p.x,0)/pts.length;
                    const childCy = pts.reduce((a,p)=>a+p.y,0)/pts.length;
                    const cCx = (childCx - globalCx)/CM * options.scale;
                    const cCy = -(childCy - globalCy)/CM * options.scale;
                    const C_local = new THREE.Vector3(cCx, cCy, 0).sub(edgeCenter).applyQuaternion(invQ);
                    const foldSign = C_local.y > 0 ? 1 : -1;
                    
                    foldHinges.push({ pivot: hingePivot, sign: foldSign });
                    hingePivot.add(mesh);
                    parentMesh.add(hingeBase);
                } else {
                    parentMesh.add(mesh);
                }
                
                node.neighbors.forEach(nb => {
                    if (!nb.node.visited) {
                        nb.node.visited = true;
                        queue.push({ node: nb.node, parentMesh: mesh, hingeEdge: nb.edge });
                    }
                });
            }
        });
        const initialAngle = options.foldAngle * Math.PI / 180;
        if (initialAngle !== 0) foldHinges.forEach(h => h.pivot.rotation.x = initialAngle * h.sign);
    } else {
        selected.forEach((shape, index) => {
            const colNum=parseInt(shape.color.replace('#',''),16);
            const matFace=new THREE.MeshStandardMaterial({color:new THREE.Color(colNum),roughness:0.25,metalness:0.18});
            const matSide=new THREE.MeshStandardMaterial({color:new THREE.Color(colNum).multiplyScalar(0.6),roughness:0.5});
            let mesh;

            if (shape.type === 'circle') {
                const scaledR=(shape.r/CM) * options.scale;
                if (options.shapeType === 'pyramid') {
                    // Círculo + Pirámide = Cono
                    const geo = new THREE.ConeGeometry(scaledR, unifiedDepth, 48);
                    geo.rotateX(Math.PI / 2);
                    geo.translate(0, 0, unifiedDepth / 2);
                    const matCone = new THREE.MeshStandardMaterial({color:new THREE.Color(colNum), roughness:0.25, metalness:0.18, flatShading: true});
                    mesh = new THREE.Mesh(geo, matCone);
                } else if (options.shapeType === 'cylinder') {
                    // Círculo + Cilindro = Cilindro
                    const geo = new THREE.CylinderGeometry(scaledR, scaledR, unifiedDepth, 48);
                    geo.rotateX(Math.PI / 2);
                    geo.translate(0, 0, unifiedDepth / 2);
                    mesh = new THREE.Mesh(geo, matFace);
                } else {
                    // Círculo + Prisma/Esfera = Esfera (cuerpo 3D natural del círculo)
                    const geo = new THREE.SphereGeometry(scaledR, 48, 32);
                    const matSphere = new THREE.MeshStandardMaterial({color:new THREE.Color(colNum), roughness:0.2, metalness:0.25});
                    mesh = new THREE.Mesh(geo, matSphere);
                }
            } else {
                const pts=shape.pts;
                const cx=pts.reduce((a,p)=>a+p.x,0)/pts.length/CM;
                const cy=pts.reduce((a,p)=>a+p.y,0)/pts.length/CM;
                const scale=options.scale;
                const norm=pts.map(p=>({x:(p.x/CM-cx)*scale, y:-(p.y/CM-cy)*scale}));
                let area=0;
                for (let i=0;i<norm.length;i++) {
                    const p1=norm[i], p2=norm[(i+1)%norm.length];
                    area += (p1.x*p2.y) - (p2.x*p1.y);
                }
                const ordered = area < 0 ? [...norm].reverse() : norm;
                
                if (options.shapeType === 'pyramid') {
                    const vertices = [];
                    const indices = [];
                    ordered.forEach(p => vertices.push(p.x, p.y, 0));
                    vertices.push(0, 0, unifiedDepth);
                    const tipIndex = ordered.length;
                    
                    const tsh = new THREE.Shape();
                    tsh.moveTo(ordered[0].x, ordered[0].y);
                    ordered.slice(1).forEach(p => tsh.lineTo(p.x, p.y));
                    tsh.closePath();
                    
                    const baseGeo = new THREE.ShapeGeometry(tsh);
                    for (let i = 0; i < baseGeo.index.count; i += 3) {
                        indices.push(baseGeo.index.array[i], baseGeo.index.array[i+2], baseGeo.index.array[i+1]);
                    }
                    
                    for (let i = 0; i < ordered.length; i++) {
                        const nextI = (i + 1) % ordered.length;
                        indices.push(i, nextI, tipIndex);
                    }
                    
                    const geo = new THREE.BufferGeometry();
                    geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                    geo.setIndex(indices);
                    geo.computeVertexNormals();
                    
                    geo.clearGroups();
                    geo.addGroup(0, baseGeo.index.count, 0);
                    geo.addGroup(baseGeo.index.count, ordered.length * 3, 1);
                    
                    // Bug 5: Flat shading para que las caras de la pirámide se vean facetadas
                    const matPyrBase = new THREE.MeshStandardMaterial({color:new THREE.Color(colNum), roughness:0.25, metalness:0.18, flatShading: true});
                    const matPyrSide = new THREE.MeshStandardMaterial({color:new THREE.Color(colNum).multiplyScalar(0.7), roughness:0.35, metalness:0.15, flatShading: true});
                    mesh = new THREE.Mesh(geo, [matPyrBase, matPyrSide]);
                } else if (options.shapeType === 'cylinder') {
                    // Polígono + Cilindro = Prisma (extrusión, mismo comportamiento)
                    const tsh=new THREE.Shape();
                    tsh.moveTo(ordered[0].x, ordered[0].y);
                    ordered.slice(1).forEach(p=>tsh.lineTo(p.x,p.y));
                    tsh.closePath();
                    const geo=new THREE.ExtrudeGeometry(tsh,{depth: unifiedDepth, bevelEnabled:false});
                    mesh=new THREE.Mesh(geo,[matFace, matSide]);
                } else {
                    // Polígono + Prisma = Prisma (extrusión)
                    const tsh=new THREE.Shape();
                    tsh.moveTo(ordered[0].x, ordered[0].y);
                    ordered.slice(1).forEach(p=>tsh.lineTo(p.x,p.y));
                    tsh.closePath();
                    const geo=new THREE.ExtrudeGeometry(tsh,{depth: unifiedDepth, bevelEnabled:false});
                    mesh=new THREE.Mesh(geo,[matFace, matSide]);
                }
            }

            mesh.castShadow=true; mesh.receiveShadow=true;
            const center = getShapeCenter(shape);
            
            const x = (center.x - globalCx) / CM * options.scale;
            const y = -(center.y - globalCy) / CM * options.scale;
            // Esfera no necesita offset en Z ya que está centrada naturalmente
            const isSphereMesh = (shape.type === 'circle' && options.shapeType === 'prism');
            const z = isSphereMesh ? 0 : -unifiedDepth / 2; 
            
            mesh.position.set(x, y, z);
            group.add(mesh);
            if (options.showWireframe) {
                const edgeColor = new THREE.Color(colNum).lerp(new THREE.Color(0x000000), 0.6);
                const thickEdges = createThickEdges(mesh.geometry, edgeColor, 0.08);
                mesh.add(thickEdges);
            }
        });
    }

    // Calcular el nivel del suelo dinámicamente basado en la figura más baja
    const floorY = -(maxY - globalCy) / CM * options.scale - 0.5;
    
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(50,50), new THREE.MeshStandardMaterial({color:theme.floor, roughness:1}));
    floor.rotation.x=-Math.PI/2; floor.position.y=floorY; floor.receiveShadow=true; scene.add(floor);
    
    const grid = new THREE.GridHelper(50,50,theme.grid, theme.floor);
    grid.position.y = floorY;
    scene.add(grid);

    // Calcular información educativa V, E, F (Fórmula de Euler)
    let infoHTML = '';
    if (selected.length === 1) {
        const s = selected[0];
        const shapeType3D = options.shapeType;
        if (s.type === 'circle') {
            if (shapeType3D === 'pyramid') {
                infoHTML = `✅ <b>Cono</b><br>🔵 Vértice (punta): <b>1</b><br>📏 Base: <b>circular</b><br>🎨 Caras: <b>2</b> (base + lateral)`;
            } else if (shapeType3D === 'cylinder') {
                infoHTML = `✅ <b>Cilindro</b><br>📏 Radio: <b>${(s.r/CM).toFixed(1)}</b> u<br>🎨 Caras: <b>3</b> (2 bases + lateral)<br>🔵 Aristas: <b>2</b> (curvas)`;
            } else {
                infoHTML = `✅ <b>Esfera</b><br>📏 Radio: <b>${(s.r/CM).toFixed(1)}</b> u<br>🎨 Caras: <b>1</b> (continua)<br>🔵 Vértices: <b>0</b><br>📐 Aristas: <b>0</b>`;
            }
        } else {
            const n = s.pts.length;
            const names = {3:'Triángulo', 4:'Cuadrilátero', 5:'Pentágono', 6:'Hexágono', 7:'Heptágono', 8:'Octágono'};
            const baseName = names[n] || `Polígono de ${n} lados`;
            if (shapeType3D === 'pyramid') {
                const V = n + 1;
                const E = n * 2;
                const F = n + 1;
                infoHTML = `✅ <b>Pirámide — base ${baseName}</b><br>🔵 Vértices (V): <b>${V}</b><br>📏 Aristas (E): <b>${E}</b><br>🎨 Caras (F): <b>${F}</b><br>📐 V−E+F = ${V}−${E}+${F} = <b>2</b> ✓`;
            } else {
                const V = n * 2;
                const E = n * 3;
                const F = n + 2;
                infoHTML = `✅ <b>Prisma — base ${baseName}</b><br>🔵 Vértices (V): <b>${V}</b><br>📏 Aristas (E): <b>${E}</b><br>🎨 Caras (F): <b>${F}</b><br>📐 V−E+F = ${V}−${E}+${F} = <b>2</b> ✓`;
            }
        }
    } else {
        infoHTML = `✅ <b>${selected.length} figuras</b> — tema ${options.theme} · escala ${options.scale.toFixed(1)}`;
    }
    const bodyNames = {prism: 'Prisma/Esfera', pyramid: 'Pirámide/Cono', cylinder: 'Cilindro'};
    infoHTML += `<br><span style="font-size:0.85rem;color:#888;">Forma: ${bodyNames[options.shapeType] || options.shapeType}</span>`;
    document.getElementById('sideInfo').innerHTML = infoHTML;

    current3dShape = group;

    function animate(){
        anim3d=requestAnimationFrame(animate);
        ctrl.update();
        rend3d.render(scene,cam);
    }
    animate();

    document.getElementById('modal3d').onclick=e=>{if(e.target===document.getElementById('modal3d'))close3D();};
}

// ──────────────────────────────────────────────────────────────────
window.addEventListener('resize', resizeCanvas);
window.addEventListener('load', resizeCanvas);

// ──────────────────────────────────────────────────────────────────
//  TOOLTIPS PERSONALIZADOS
// ──────────────────────────────────────────────────────────────────
const tooltipEl = document.getElementById('tooltip');

document.querySelectorAll('[title]').forEach(el => {
    const titleText = el.getAttribute('title');
    if (!titleText) return;
    
    // Quitar el 'title' nativo para que no aparezcan dos tooltips
    el.removeAttribute('title');

    el.addEventListener('mouseenter', () => {
        if (el.disabled) return; // No mostrar si el botón está deshabilitado
        tooltipEl.textContent = titleText;
        
        const rect = el.getBoundingClientRect();
        
        // Posicionar el tooltip centrado encima del botón
        tooltipEl.style.left = `${rect.left + rect.width / 2}px`;
        tooltipEl.style.top = `${rect.top}px`;
        
        tooltipEl.classList.add('visible');
    });

    el.addEventListener('mouseleave', () => {
        tooltipEl.classList.remove('visible');
    });
});
</script>
</body>
