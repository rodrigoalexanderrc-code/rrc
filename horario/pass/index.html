<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="cache-control" content="no-cache">
    <meta http-equiv="expires" content="0">
    <meta http-equiv="pragma" content="no-cache">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios Laboratorios</title>
    <style>
        /* Estilos generales */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none; /* Evitar selección de texto */
        }

        /* Contenedor principal */
        .container {
            text-align: center;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0px 8px 24px rgba(0, 0, 0, 0.08);
            padding: 40px 30px;
            width: 340px;
            transition: all 0.3s ease;
        }

        .logo {
            width: 100px;
            margin-bottom: 20px;
        }

        h2 {
            color: #333333;
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #e1e5ee;
            background-color: #f9fafb;
            font-size: 14px;
            transition: border 0.3s ease;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
        }

        button {
            background-color: #3b82f6;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2563eb;
        }

        /* Mensaje de error */
        .error-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(239, 68, 68, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: 500;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        /* Frame para el contenido */
        #content-frame {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 900;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Contenedor principal -->
    <div class="container" id="login-container">
        <img src="https://www.liceo-simonbolivar.cl/intranet/insignia/ESCUDO.png" alt="Liceo Simón Bolívar" class="logo">
        <h2>Acceso al Sistema</h2>
        <h2>Horario Laboratorios</h2>

        <!-- Formulario -->
        <form id="login-form">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" autocomplete="off" readonly onfocus="this.removeAttribute('readonly');" placeholder="Ingrese su usuario">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="off" readonly onfocus="this.removeAttribute('readonly');" placeholder="Ingrese su contraseña">
            </div>

            <button type="button" onclick="validateUser()">Ingresar</button>
        </form>
    </div>

    <!-- Mensaje de error -->
    <div id="error-message" class="error-message">
        Usuario o contraseña incorrectos
    </div>

    <!-- Marco para mostrar la página web -->
    <iframe id="content-frame" frameborder="0"></iframe>

    <!-- Script -->
    <script>
        function validateUser() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');
            const loginContainer = document.getElementById('login-container');
            const contentFrame = document.getElementById('content-frame');

            // Validar credenciales
            if ((username === "rodrigo" && password === "Kakaroto123") ||
                (username === "profesores" && password === "lsb2124")) {

                // Ocultar el formulario de login
                loginContainer.style.display = 'none';

                // Mostrar el iframe con la página web
                contentFrame.style.display = 'block';

                // Cargar la página en el iframe
                // Usamos un timestamp para evitar caché
                const timestamp = new Date().getTime();
                contentFrame.src = `http://172.100.102.198/horario/horario.html?nocache=${timestamp}`;

            } else {
                // Mostrar mensaje de error
                errorMessage.style.display = 'block';

                // Ocultar el mensaje después de 3 segundos
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 3000);
            }
        }

        // Bloquear el menú contextual
        document.oncontextmenu = function() {
            return false;
        };

        // Permitir enviar el formulario con Enter
        document.getElementById('password').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                validateUser();
            }
        });
    </script>
</body>
</html>
