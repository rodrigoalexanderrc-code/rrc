<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporizador de Aula</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        /* ── CSS Custom Properties for theming ── */
        :root {
            --bg-container: rgba(255, 255, 255, 0.75);
            --text-primary: #0039a6;
            --text-secondary: #4a4a4a;
            --border-color: #0039a6;
            --input-bg: rgba(255, 255, 255, 0.9);
            --input-border: #ffcc00;
            --bubble-bg: white;
            --card-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            --progress-bg: rgba(224, 224, 224, 0.6);
            --btn-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            --star-color: #ffcc00;
            --toggle-bg: rgba(255, 255, 255, 0.4);
        }

        [data-theme="dark"] {
            --bg-container: rgba(30, 30, 50, 0.82);
            --text-primary: #6ec6ff;
            --text-secondary: #c0c0d0;
            --border-color: #6ec6ff;
            --input-bg: rgba(40, 40, 70, 0.9);
            --input-border: #ffcc00;
            --bubble-bg: rgba(40, 40, 70, 0.95);
            --card-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            --progress-bg: rgba(60, 60, 90, 0.6);
            --btn-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
            --star-color: #ffdd44;
            --toggle-bg: rgba(0, 0, 0, 0.3);
        }

        [data-theme="dark"] .time-up-message {
            background: #1e1e32;
            color: #c0c0d0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 1s ease;
            overflow-x: hidden;
        }

        /* ── Canvas backgrounds ── */
        #seasonCanvas,
        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        #confettiCanvas {
            z-index: 200;
        }

        /* ── Season backgrounds ── */
        body.verano {
            background: linear-gradient(180deg, #4facfe 0%, #00f2fe 40%, #ffdf80 80%, #ffb347 100%);
        }

        body.otono {
            background: linear-gradient(180deg, #d4a373 0%, #faedcd 40%, #e9edc9 70%, #ccd5ae 100%);
        }

        body.invierno {
            background: linear-gradient(180deg, #1c2833 0%, #34495e 40%, #85c1e9 80%, #d6eaf8 100%);
        }

        body.primavera {
            background: linear-gradient(180deg, #a1c4fd 0%, #c2e9fb 40%, #e0c3fc 70%, #8ec5fc 100%);
        }

        /* ── Glassmorphism container ── */
        .container {
            background: var(--bg-container);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: var(--card-shadow);
            padding: 40px;
            width: 100%;
            max-width: 750px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 10;
            transition: background 0.5s ease, box-shadow 0.5s ease;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            gap: 20px;
        }

        .escudo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            border: 3px solid var(--border-color);
            transition: border-color 0.5s;
        }

        .escudo img {
            width: 75px;
            height: 75px;
            object-fit: contain;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: var(--text-primary);
            font-size: 3rem;
            text-shadow: 3px 3px 0 rgba(255, 204, 0, 0.4);
            position: relative;
            animation: titleFloat 3s ease-in-out infinite;
            transition: color 0.5s;
        }

        @keyframes titleFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        /* ── Top controls row ── */
        .top-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .season-indicator {
            background: var(--toggle-bg);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: var(--text-primary);
            transition: all 0.5s;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: var(--toggle-bg);
            backdrop-filter: blur(10px);
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            padding: 0;
        }

        .icon-btn:hover {
            transform: scale(1.15);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
        }

        /* ── Circular progress ring ── */
        .circular-progress-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
        }

        .circular-progress {
            transform: rotate(-90deg);
            filter: drop-shadow(0 4px 15px rgba(0, 57, 166, 0.25));
        }

        .progress-ring-bg {
            fill: none;
            stroke: var(--progress-bg);
            stroke-width: 10;
            transition: stroke 0.5s;
        }

        .progress-ring-fill {
            fill: none;
            stroke: url(#progressGradient);
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear;
        }

        .timer-display {
            position: absolute;
            font-family: 'Fredoka One', cursive;
            font-size: 4rem;
            font-weight: bold;
            background: linear-gradient(135deg, #0039a6, #ff0000, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            z-index: 20;
            transition: transform 0.3s ease;
        }

        .timer-display.tick {
            animation: digitPop 0.3s ease;
        }

        @keyframes digitPop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }

            100% {
                transform: scale(1);
            }
        }

        /* ── Message container ── */
        .message-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
            min-height: 110px;
            position: relative;
        }

        .dog-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            order: 2;
        }

        .dog-image {
            width: 140px;
            height: 140px;
            object-fit: contain;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.15));
        }

        .dog-image:hover {
            transform: scale(1.1) rotate(-5deg);
        }

        .dog-image.alarm {
            animation: shake 0.5s infinite alternate;
        }

        @keyframes shake {
            from {
                transform: translateX(-5px) rotate(-3deg);
            }

            to {
                transform: translateX(5px) rotate(3deg);
            }
        }

        .cloud-bubble {
            position: relative;
            background: var(--bubble-bg);
            border-radius: 20px;
            padding: 12px 18px;
            max-width: 280px;
            border: 2px solid var(--input-border);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            font-size: 1.15rem;
            color: var(--text-primary);
            font-weight: 700;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            order: 1;
            transition: all 0.5s;
            animation: bubbleFloat 4s ease-in-out infinite;
        }

        @keyframes bubbleFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        .cloud-bubble:after {
            content: '';
            position: absolute;
            right: -18px;
            top: 50%;
            transform: translateY(-50%);
            border: 9px solid transparent;
            border-left-color: var(--input-border);
        }

        /* ── Quick presets ── */
        .presets {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 12px 0;
            flex-wrap: wrap;
        }

        .preset-btn {
            padding: 8px 20px;
            border: 2px solid var(--border-color);
            border-radius: 25px;
            background: transparent;
            color: var(--text-primary);
            font-family: 'Nunito', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: none;
        }

        .preset-btn:hover {
            background: var(--text-primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 57, 166, 0.3);
        }

        .preset-btn:active {
            transform: translateY(0);
        }

        /* ── Time inputs with stepper ── */
        .time-inputs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 12px 0;
            position: relative;
        }

        .time-input {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .time-input label {
            font-size: 0.9rem;
            color: var(--text-primary);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.5s;
        }

        .stepper {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stepper-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            padding: 0;
            line-height: 1;
            box-shadow: none;
        }

        .stepper-btn:hover {
            background: var(--text-primary);
            color: white;
            transform: scale(1.1);
        }

        .stepper-btn:active {
            transform: scale(0.95);
        }

        .time-input input {
            width: 70px;
            padding: 10px 4px;
            border: 2px solid var(--input-border);
            border-radius: 14px;
            font-size: 1.4rem;
            text-align: center;
            font-weight: 800;
            color: var(--text-primary);
            background: var(--input-bg);
            font-family: 'Fredoka One', cursive;
            transition: all 0.3s ease;
        }

        .time-input input:focus {
            outline: none;
            border-color: var(--text-primary);
            box-shadow: 0 0 0 3px rgba(0, 57, 166, 0.15);
        }

        /* ── Linear progress bar ── */
        .progress-container {
            width: 100%;
            height: 14px;
            background: var(--progress-bg);
            border-radius: 10px;
            margin: 18px 0;
            overflow: visible;
            position: relative;
            border: none;
            transition: background 0.5s;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #0039a6, #ff0000, #ffcc00);
            width: 0%;
            transition: width 1s linear;
            border-radius: 10px;
            position: relative;
            box-shadow: 0 2px 10px rgba(0, 57, 166, 0.3);
        }

        .season-icon-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .season-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            z-index: 10;
            transition: left 1s linear;
            left: 0px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        /* ── Control buttons ── */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 18px 0 10px;
            position: relative;
        }

        button.control-btn {
            padding: 12px 28px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--btn-shadow);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button.control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }

        button.control-btn:active {
            transform: translateY(1px);
        }

        #startBtn {
            background: linear-gradient(135deg, #56d879, #38c956);
            color: white;
        }

        #pauseBtn {
            background: linear-gradient(135deg, #ffd54f, #ffca28);
            color: #333;
        }

        #resetBtn {
            background: linear-gradient(135deg, #ff7070, #ef5350);
            color: white;
        }

        /* ── Urgency mode (last 30 seconds) ── */
        .container.urgency {
            border-color: #ff0000;
            animation: urgencyPulse 1s ease-in-out infinite;
        }

        @keyframes urgencyPulse {
            0%, 100% {
                box-shadow: 0 0 20px rgba(255, 0, 0, 0.2), var(--card-shadow);
            }
            50% {
                box-shadow: 0 0 40px rgba(255, 0, 0, 0.5), 0 0 80px rgba(255, 0, 0, 0.2), var(--card-shadow);
            }
        }

        .container.urgency-shake {
            animation: urgencyPulse 1s ease-in-out infinite, containerShake 0.4s ease-in-out infinite;
        }

        @keyframes containerShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }

        .timer-display.urgency {
            background: linear-gradient(135deg, #ff0000, #ff4444, #ff0000) !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            animation: heartbeat 0.8s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.12); }
            30% { transform: scale(1); }
            45% { transform: scale(1.08); }
            60% { transform: scale(1); }
        }

        .progress-ring-fill.urgency {
            stroke: #ff0000 !important;
            filter: drop-shadow(0 0 8px rgba(255, 0, 0, 0.6));
        }

        .progress-bar.urgency {
            background: linear-gradient(90deg, #ff0000, #ff4444, #ff0000) !important;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        .cloud-bubble.urgency {
            border-color: #ff0000;
            animation: bubbleFloat 2s ease-in-out infinite, bubbleUrgency 0.6s ease-in-out infinite;
        }

        @keyframes bubbleUrgency {
            0%, 100% { box-shadow: 0 4px 15px rgba(255, 0, 0, 0.1); }
            50% { box-shadow: 0 4px 20px rgba(255, 0, 0, 0.4); }
        }

        /* ── Decorations with micro-animations ── */
        .decoration {
            position: absolute;
            z-index: 0;
        }

        .star {
            position: absolute;
            background-color: var(--star-color);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            transition: background-color 0.5s;
        }

        .star1 {
            width: 35px;
            height: 35px;
            top: 60px;
            right: 60px;
            animation: rotateStar 8s linear infinite;
        }

        .star2 {
            width: 25px;
            height: 25px;
            bottom: 80px;
            left: 70px;
            animation: rotateStar 12s linear infinite reverse;
        }

        @keyframes rotateStar {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            animation: floatCircle 5s ease-in-out infinite;
        }

        .circle1 {
            width: 30px;
            height: 30px;
            background-color: var(--border-color);
            top: 100px;
            left: 50px;
            animation-delay: 0s;
            transition: background-color 0.5s;
        }

        .circle2 {
            width: 22px;
            height: 22px;
            background-color: #ff4444;
            bottom: 100px;
            right: 60px;
            animation-delay: 2s;
        }

        @keyframes floatCircle {

            0%,
            100% {
                transform: translateY(0) scale(1);
                opacity: 0.7;
            }

            50% {
                transform: translateY(-10px) scale(1.1);
                opacity: 1;
            }
        }

        /* ── Time-up overlay ── */
        .time-up-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
        }

        .time-up-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .time-up-message {
            background: white;
            padding: 40px 60px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 4px solid #ff0000;
            transform: scale(0.8);
            transition: transform 0.5s ease;
        }

        .time-up-overlay.show .time-up-message {
            transform: scale(1);
            animation: celebrateMessage 0.6s ease;
        }

        @keyframes celebrateMessage {
            0% {
                transform: scale(0.5) rotate(-5deg);
            }

            50% {
                transform: scale(1.05) rotate(2deg);
            }

            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        .time-up-message h2 {
            font-family: 'Fredoka One', cursive;
            font-size: 3.5rem;
            color: #ff0000;
            margin-bottom: 15px;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.1);
        }

        .time-up-message p {
            font-size: 1.3rem;
            color: var(--text-primary);
            font-weight: 700;
        }

        /* ── Dog alarm ── */
        .dog-alarm {
            position: fixed;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffcc00, #ff9900);
            border: 3px solid #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
            z-index: 5;
            pointer-events: none;
            display: none;
            animation: pulse 1s infinite alternate;
        }

        .dog-alarm.show {
            display: block;
        }

        .dog-alarm::before {
            content: "🐶";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
        }

        @keyframes pulse {
            from {
                transform: scale(1);
                box-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
            }

            to {
                transform: scale(1.1);
                box-shadow: 0 0 25px rgba(255, 0, 0, 0.9);
            }
        }

        /* ── Alarm message ── */
        .alarm-message {
            position: fixed;
            background: white;
            border-radius: 25px;
            padding: 15px 20px;
            max-width: 300px;
            border: 3px solid #ff0000;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            font-size: 1.4rem;
            color: #ff0000;
            font-weight: bold;
            text-align: center;
            z-index: 50;
            pointer-events: none;
            display: none;
        }

        .alarm-message.show {
            display: block;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .container {
                padding: 30px 15px;
                max-width: 95%;
            }

            .header {
                flex-direction: column;
                gap: 10px;
            }

            h1 {
                font-size: 2.2rem;
            }

            .timer-display {
                font-size: 2.8rem;
            }

            .circular-progress-wrapper svg {
                width: 220px;
                height: 220px;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }

            button.control-btn {
                width: 80%;
                justify-content: center;
            }

            .time-inputs {
                gap: 12px;
            }

            .presets {
                gap: 6px;
            }

            .preset-btn {
                padding: 6px 14px;
                font-size: 0.85rem;
            }

            .message-container {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            .cloud-bubble:after {
                right: 50%;
                top: -18px;
                transform: translateX(50%);
                border: 9px solid transparent;
                border-bottom-color: var(--input-border);
            }

            .dog-container {
                order: 1;
            }

            .cloud-bubble {
                order: 2;
            }

            .time-input input {
                width: 60px;
                font-size: 1.2rem;
            }

            .time-up-message {
                padding: 30px;
                margin: 20px;
            }

            .time-up-message h2 {
                font-size: 2.5rem;
            }

            .time-up-message p {
                font-size: 1.1rem;
            }

            .top-controls {
                position: relative;
                top: auto;
                right: auto;
                justify-content: center;
                margin-bottom: 10px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>
    <canvas id="seasonCanvas"></canvas>
    <canvas id="confettiCanvas"></canvas>

    <div class="container">
        <!-- Top controls: season, dark mode, sound -->
        <div class="top-controls">
            <div class="season-indicator" id="seasonIndicator"></div>
            <button class="icon-btn" id="darkModeBtn" title="Modo oscuro">🌙</button>

                <label for="seconds">Segundos</label>

        <!-- Linear progress bar -->

    <!-- Time-up overlay -->
    <div class="time-up-overlay" id="timeUpOverlay">

            <h2>¡SE ACABÓ EL TIEMPO!</h2>

    <!-- Dog alarm (bouncing circle) -->
    <div class="dog-alarm" id="dogAlarm"></div>

    <!-- Alarm message -->
    <div class="alarm-message" id="alarmMessage">¡SE ACABA EL TIEMPO!</div>

    <script>
        // ══════════════════════════════════════════════
        // ── DOM Elements
        // ══════════════════════════════════════════════
        const timerDisplay = document.getElementById('timer');
        const hoursInput = document.getElementById('hours');
        const minutesInput = document.getElementById('minutes');
        const secondsInput = document.getElementById('seconds');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const progressBar = document.getElementById('progressBar');
        const progressRing = document.getElementById('progressRing');
        const messageElement = document.getElementById('message');
        const seasonIndicator = document.getElementById('seasonIndicator');
        const seasonIcon = document.getElementById('seasonIcon');
        const dogImage = document.getElementById('dogImage');
        const timeUpOverlay = document.getElementById('timeUpOverlay');
        const dogAlarm = document.getElementById('dogAlarm');
        const alarmMessage = document.getElementById('alarmMessage');
        const darkModeBtn = document.getElementById('darkModeBtn');
        const soundBtn = document.getElementById('soundBtn');
        const body = document.body;

        // ══════════════════════════════════════════════
        // ── State
        // ══════════════════════════════════════════════
        let totalTime = 0;
        let timeLeft = 0;
        let timerInterval = null;
        let isRunning = false;
        let isPaused = false;
        let alarmTriggered = false;
        let alarmSound;
        let soundEnabled = true;
        let lastDisplayedTime = '';

        const RING_CIRCUMFERENCE = 2 * Math.PI * 130; // ≈816.81

        // ══════════════════════════════════════════════
        // ── Messages
        // ══════════════════════════════════════════════
        const messages = [
            "¡Guau! ¡Vamos, tú puedes!",
            "¡Woof! ¡Sigue así!",
            "¡Eres increíble! ¡Guau guau!",
            "¡Qué bien lo haces! ¡Woof!",
            "¡Estás haciendo un gran trabajo!",
            "¡Eres un campeón/una campeona!",
            "¡No te rindas! ¡Guau!",
            "¡Casi terminamos! ¡Woof woof!",
            "¡Lo estás logrando! ¡Guau!"
        ];

        const alarmMessages = [
            "¡GUAU! ¡Se acaba el tiempo!",
            "¡Corre! ¡Queda poco!",
            "¡Woof! ¡Date prisa!",
            "¡Apúrate! ¡Se acaba!",
            "¡GUAU GUAU! ¡Últimos segundos!"
        ];

        // ══════════════════════════════════════════════
        // ── Season Icons (SVG data URIs)
        // ══════════════════════════════════════════════
        const seasonIcons = {
            verano: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="25" fill="%23FFCC00" stroke="%23FF9900" stroke-width="3"/><path d="M50,15 L50,5 M50,95 L50,85 M15,50 L5,50 M95,50 L85,50 M25,25 L18,18 M75,75 L82,82 M25,75 L18,82 M75,25 L82,18" stroke="%23FF9900" stroke-width="4"/></svg>',
            otono: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M35,50 Q50,35 65,50 Q50,65 35,50" fill="%23bc6c25" stroke="%238b4513" stroke-width="2"/><path d="M40,45 L30,35 M50,35 L40,25 M60,45 L70,35" stroke="%238b4513" stroke-width="3"/></svg>',
            invierno: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50,20 L60,40 L80,40 L65,55 L75,75 L50,65 L25,75 L35,55 L20,40 L40,40 Z" fill="%23FFFFFF" stroke="%236ecbf5" stroke-width="2"/><path d="M30,15 L35,25 M45,10 L50,20 M65,15 L60,25" stroke="%236ecbf5" stroke-width="2"/></svg>',
            primavera: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="20" fill="%23FF69B4"/><path d="M50,30 L55,25 L60,30 M70,40 L75,35 L80,40 M70,60 L75,65 L80,60 M50,70 L55,75 L60,70 M30,60 L25,65 L20,60 M30,40 L25,35 L20,40" stroke="%2356ab2f" stroke-width="3"/></svg>'
        };

        // ══════════════════════════════════════════════
        // ── Dark Mode Toggle
        // ══════════════════════════════════════════════
        function toggleDarkMode() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            darkModeBtn.textContent = isDark ? '🌙' : '☀️';
        }
        darkModeBtn.addEventListener('click', toggleDarkMode);

        // ══════════════════════════════════════════════
        // ── Sound Toggle
        // ══════════════════════════════════════════════
        function toggleSound() {
            soundEnabled = !soundEnabled;
            soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
            if (!soundEnabled && alarmSound) {
                alarmSound.pause();
            }
        }
        soundBtn.addEventListener('click', toggleSound);

        // ══════════════════════════════════════════════
        // ── Preset Buttons
        // ══════════════════════════════════════════════
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (isRunning) return;
                const mins = parseInt(btn.dataset.minutes);
                hoursInput.value = 0;
                minutesInput.value = mins;
                secondsInput.value = 0;
                initializeTimer();
                messageElement.textContent = `⏱ ${mins} minuto${mins > 1 ? 's' : ''} configurado${mins > 1 ? 's' : ''}`;
            });
        });

        // ══════════════════════════════════════════════
        // ── Stepper Buttons (+/−)
        // ══════════════════════════════════════════════
        document.querySelectorAll('.stepper-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (isRunning) return;
                const input = document.getElementById(btn.dataset.target);
                const dir = parseInt(btn.dataset.dir);
                const min = parseInt(input.min);
                const max = parseInt(input.max);
                let val = (parseInt(input.value) || 0) + dir;
                if (val < min) val = max;
                if (val > max) val = min;
                input.value = val;
                initializeTimer();
            });
        });

        // ══════════════════════════════════════════════
        // ── Canvas: Season Background
        // ══════════════════════════════════════════════
        const canvas = document.getElementById('seasonCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let currentSeason = 'verano';
        let animFrameId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const cc = document.getElementById('confettiCanvas');
            cc.width = window.innerWidth;
            cc.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createParticles(season) {
            particles = [];
            const count = season === 'invierno' ? 150 : season === 'otono' ? 80 : season === 'primavera' ? 90 : 15;
            for (let i = 0; i < count; i++) {
                particles.push(makeParticle(season, true));
            }
        }

        function makeParticle(season, randomY) {
            const x = Math.random() * canvas.width;
            const y = randomY ? Math.random() * canvas.height : -20;
            if (season === 'verano') {
                return {
                    x, y: randomY ? Math.random() * canvas.height * 0.4 : -80,
                    w: 100 + Math.random() * 150, h: 50 + Math.random() * 50,
                    speed: 0.1 + Math.random() * 0.3, opacity: 0.6 + Math.random() * 0.3,
                    cloudType: Math.floor(Math.random() * 3)
                };
            } else if (season === 'otono') {
                const colors = ['#d4520a', '#e07b10', '#bc6c25', '#e8a020', '#8b4513', '#c0392b', '#f1c40f'];
                return {
                    x, y, size: 12 + Math.random() * 20,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speedY: 1.5 + Math.random() * 2.5, speedX: -1.5 + Math.random() * 3,
                    rot: Math.random() * Math.PI * 2, rotSpeed: (-0.08 + Math.random() * 0.16),
                    swing: 1 + Math.random() * 3, swingOff: Math.random() * Math.PI * 2,
                    type: Math.random() > 0.5 ? 1 : 2
                };
            } else if (season === 'invierno') {
                const isRain = Math.random() > 0.4;
                return {
                    x, y, isRain,
                    len: isRain ? 20 + Math.random() * 30 : 4 + Math.random() * 8,
                    speed: isRain ? 12 + Math.random() * 10 : 2 + Math.random() * 3,
                    opacity: isRain ? 0.3 + Math.random() * 0.4 : 0.6 + Math.random() * 0.4,
                    rot: isRain ? 0.2 : 0,
                    glow: Math.random() > 0.8
                };
            } else {
                const colors = ['#ffb7b2', '#ffdac1', '#e2f0cb', '#b5ead7', '#c7ceea', '#ff9aa2'];
                return {
                    x, y, size: 8 + Math.random() * 15,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speedY: 1 + Math.random() * 2, speedX: -1 + Math.random() * 2,
                    rot: Math.random() * Math.PI * 2, rotSpeed: -0.05 + Math.random() * 0.1,
                    swing: 1.5 + Math.random() * 2, swingOff: Math.random() * Math.PI * 2
                };
            }
        }

        function drawCloud(x, y, w, h, opacity, type) {
            ctx.save();
            ctx.globalAlpha = opacity;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            if (type === 0) {
                ctx.arc(x, y, h * 0.5, 0, Math.PI * 2);
                ctx.arc(x + w * 0.3, y - h * 0.3, h * 0.6, 0, Math.PI * 2);
                ctx.arc(x + w * 0.7, y, h * 0.4, 0, Math.PI * 2);
                ctx.rect(x, y - h * 0.1, w * 0.7, h * 0.6);
            } else if (type === 1) {
                ctx.ellipse(x, y, w * 0.5, h * 0.5, 0, 0, Math.PI * 2);
                ctx.ellipse(x + w * 0.3, y - h * 0.2, w * 0.35, h * 0.45, 0, 0, Math.PI * 2);
                ctx.ellipse(x - w * 0.3, y - h * 0.1, w * 0.3, h * 0.4, 0, 0, Math.PI * 2);
                ctx.ellipse(x + w * 0.1, y + h * 0.1, w * 0.4, h * 0.35, 0, 0, Math.PI * 2);
            } else {
                ctx.arc(x, y, h * 0.6, 0, Math.PI * 2);
                ctx.arc(x + w * 0.4, y - h * 0.4, h * 0.7, 0, Math.PI * 2);
                ctx.arc(x + w * 0.8, y - h * 0.1, h * 0.5, 0, Math.PI * 2);
                ctx.arc(x + w * 0.4, y + h * 0.2, h * 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.rect(x, y, w * 0.8, h * 0.5);
            }
            ctx.fill();
            ctx.restore();
        }

        function drawLeaf(x, y, size, color, rot, type) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);
            ctx.fillStyle = color;
            ctx.beginPath();
            if (type === 1) {
                ctx.ellipse(0, 0, size * 0.4, size, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, -size);
                ctx.lineTo(0, size);
                ctx.stroke();
            } else {
                ctx.moveTo(0, -size);
                ctx.bezierCurveTo(size*0.8, -size*0.5, size*0.8, size*0.5, 0, size);
                ctx.bezierCurveTo(-size*0.8, size*0.5, -size*0.8, -size*0.5, 0, -size);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, -size);
                ctx.lineTo(0, size);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawPetal(x, y, size, color, rot) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.9;
            ctx.beginPath();
            
            // Cherry blossom petal shape
            ctx.moveTo(0, size * -0.5);
            ctx.bezierCurveTo(size * 0.5, size * -0.5, size * 0.5, size * 0.2, size * 0.2, size * 0.5);
            ctx.lineTo(0, size * 0.4);
            ctx.lineTo(size * -0.2, size * 0.5);
            ctx.bezierCurveTo(size * -0.5, size * 0.2, size * -0.5, size * -0.5, 0, size * -0.5);
            
            ctx.fill();
            
            // Inner gradient
            const grad = ctx.createRadialGradient(0, size*0.2, 0, 0, 0, size);
            grad.addColorStop(0, 'rgba(255,255,255,0.4)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fill();
            
            ctx.restore();
        }

        function drawSun() {
            const cx = canvas.width * 0.82;
            const cy = canvas.height * 0.12;
            const r = 50;
            ctx.strokeStyle = 'rgba(255,200,0,0.55)';
            ctx.lineWidth = 4;
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2 + tick * 0.005;
                ctx.beginPath();
                ctx.moveTo(cx + Math.cos(angle) * (r + 8), cy + Math.sin(angle) * (r + 8));
                ctx.lineTo(cx + Math.cos(angle) * (r + 28), cy + Math.sin(angle) * (r + 28));
                ctx.stroke();
            }
            const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
            grad.addColorStop(0, '#fff7a0');
            grad.addColorStop(0.5, '#FFDD00');
            grad.addColorStop(1, '#FFA500');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
        }

        let tick = 0;
        function animateBackground() {
            animFrameId = requestAnimationFrame(animateBackground);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            tick++;

            if (currentSeason === 'verano') {
                drawSun();
                for (const p of particles) {
                    drawCloud(p.x, p.y, p.w, p.h, p.opacity, p.cloudType);
                    p.x += p.speed;
                    if (p.x - p.w > canvas.width) p.x = -p.w;
                }
            } else if (currentSeason === 'otono') {
                for (const p of particles) {
                    drawLeaf(p.x, p.y, p.size, p.color, p.rot, p.type);
                    p.y += p.speedY;
                    p.x += p.speedX + Math.sin(tick * 0.02 + p.swingOff) * p.swing;
                    p.rot += p.rotSpeed;
                    if (p.y > canvas.height + 30) { Object.assign(p, makeParticle('otono', false)); }
                }
            } else if (currentSeason === 'invierno') {
                for (const p of particles) {
                    ctx.save();
                    ctx.globalAlpha = p.opacity;
                    if (p.isRain) {
                        ctx.strokeStyle = '#aad4f5';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p.x - p.len * Math.sin(p.rot), p.y + p.len * Math.cos(p.rot));
                        ctx.stroke();
                    } else {
                        if (p.glow) {
                            ctx.shadowBlur = 10;
                            ctx.shadowColor = '#ffffff';
                        }
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.len, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                    p.y += p.speed;
                    p.x += p.isRain ? -2 : Math.sin(tick * 0.01 + p.x) * 0.5;
                    if (p.y > canvas.height + 30) { Object.assign(p, makeParticle('invierno', false)); }
                }
            } else if (currentSeason === 'primavera') {
                for (const p of particles) {
                    drawPetal(p.x, p.y, p.size, p.color, p.rot);
                    p.y += p.speedY;
                    p.x += p.speedX + Math.sin(tick * 0.015 + p.swingOff) * p.swing;
                    p.rot += p.rotSpeed;
                    if (p.y > canvas.height + 30) { Object.assign(p, makeParticle('primavera', false)); }
                }
            }
        }

        // ══════════════════════════════════════════════
        // ── Chilean Seasons (dates corrected for ~21st)
        // ══════════════════════════════════════════════
        function getChileanSeason() {
            const now = new Date();
            const month = now.getMonth() + 1;
            const day = now.getDate();

            // Verano: 21 dic – 20 mar
            if ((month === 12 && day >= 21) || month === 1 || month === 2 || (month === 3 && day <= 20))
                return { name: 'Verano ☀️', class: 'verano', season: 'verano', icon: seasonIcons.verano };
            // Otoño: 21 mar – 20 jun
            if ((month === 3 && day >= 21) || month === 4 || month === 5 || (month === 6 && day <= 20))
                return { name: 'Otoño 🍂', class: 'otono', season: 'otono', icon: seasonIcons.otono };
            // Invierno: 21 jun – 20 sep
            if ((month === 6 && day >= 21) || month === 7 || month === 8 || (month === 9 && day <= 20))
                return { name: 'Invierno 🌧️', class: 'invierno', season: 'invierno', icon: seasonIcons.invierno };
            // Primavera: 21 sep – 20 dic
            return { name: 'Primavera 🌸', class: 'primavera', season: 'primavera', icon: seasonIcons.primavera };
        }

        function applySeason() {
            const season = getChileanSeason();
            body.className = season.class;
            seasonIndicator.textContent = `Estación: ${season.name}`;
            seasonIcon.style.backgroundImage = `url("${season.icon}")`;
            currentSeason = season.season;
            createParticles(currentSeason);
            if (animFrameId) cancelAnimationFrame(animFrameId);
            animateBackground();
        }

        // ══════════════════════════════════════════════
        // ── Progress Updates
        // ══════════════════════════════════════════════
        function updateIconPosition(progress) {
            const containerWidth = document.querySelector('.progress-container').offsetWidth;
            const iconPosition = (containerWidth * progress / 100) - 18;
            seasonIcon.style.left = `${Math.max(0, iconPosition)}px`;
        }

        function updateCircularProgress(progress) {
            const offset = RING_CIRCUMFERENCE - (RING_CIRCUMFERENCE * progress / 100);
            progressRing.style.strokeDashoffset = offset;
        }

        // ══════════════════════════════════════════════
        // ── Timer Logic
        // ══════════════════════════════════════════════
        function initializeTimer() {
            const hours = parseInt(hoursInput.value) || 0;
            const minutes = parseInt(minutesInput.value) || 0;
            const seconds = parseInt(secondsInput.value) || 0;

            totalTime = hours * 3600 + minutes * 60 + seconds;
            timeLeft = totalTime;

            updateDisplay();
            progressBar.style.width = '0%';
            updateIconPosition(0);
            updateCircularProgress(0);
            return true;
        }

        function updateDisplay() {
            const hours = Math.floor(timeLeft / 3600);
            const minutes = Math.floor((timeLeft % 3600) / 60);
            const seconds = timeLeft % 60;

            const newTime = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            // Digit pop animation on change
            if (newTime !== lastDisplayedTime) {
                timerDisplay.textContent = newTime;
                timerDisplay.classList.remove('tick');
                void timerDisplay.offsetWidth; // force reflow to restart animation
                timerDisplay.classList.add('tick');
                lastDisplayedTime = newTime;
            }

            // Update both progress indicators
            if (totalTime > 0) {
                const progress = ((totalTime - timeLeft) / totalTime) * 100;
                progressBar.style.width = `${progress}%`;
                updateIconPosition(progress);
                updateCircularProgress(progress);
            }

            // Change motivational message every 10 seconds
            if (timeLeft % 10 === 0 && timeLeft !== totalTime && timeLeft > 0) {
                const randomMessage = messages[Math.floor(Math.random() * messages.length)];
                messageElement.textContent = randomMessage;
            }

            // Trigger alarm at 30 seconds remaining
            if (timeLeft <= 30 && timeLeft > 0 && !alarmTriggered) {
                activateAlarm();
            }
        }

        // ══════════════════════════════════════════════
        // ── Alarm System
        // ══════════════════════════════════════════════
        function activateAlarm() {
            alarmTriggered = true;
            dogAlarm.classList.add('show');

            // Apply urgency visual effects
            document.querySelector('.container').classList.add('urgency');
            timerDisplay.classList.add('urgency');
            progressRing.classList.add('urgency');
            progressBar.classList.add('urgency');
            messageElement.classList.add('urgency');
            dogImage.classList.add('alarm');

            if (soundEnabled && alarmSound) {
                alarmSound.currentTime = 0;
                alarmSound.play().catch(e => console.log("Error reproduciendo sonido:", e));
            }

            animateDogAlarm();

            // Intensify shake in last 10 seconds
            setTimeout(() => {
                if (isRunning && timeLeft > 0 && timeLeft <= 10) {
                    document.querySelector('.container').classList.add('urgency-shake');
                }
            }, 20000);

            const alarmInterval = setInterval(() => {
                if (timeLeft > 0 && isRunning) {
                    const randomAlarmMessage = alarmMessages[Math.floor(Math.random() * alarmMessages.length)];
                    messageElement.textContent = randomAlarmMessage;
                } else {
                    clearInterval(alarmInterval);
                }
            }, 3000);

            setTimeout(() => {
                if (timeLeft <= 0) {
                    dogAlarm.classList.remove('show');
                    clearInterval(alarmInterval);
                }
            }, 30000);
        }

        function animateDogAlarm() {
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            const dogSize = 60;

            const containerRect = document.querySelector('.container').getBoundingClientRect();
            const safeZone = {
                top: containerRect.top - 20,
                bottom: containerRect.bottom + 20,
                left: containerRect.left - 20,
                right: containerRect.right + 20
            };

            let posX, posY;
            do {
                posX = Math.random() * (screenWidth - dogSize);
                posY = Math.random() * (screenHeight - dogSize);
            } while (
                posX > safeZone.left && posX < safeZone.right &&
                posY > safeZone.top && posY < safeZone.bottom
            );

            let directionX = Math.random() > 0.5 ? 1 : -1;
            let directionY = Math.random() > 0.5 ? 1 : -1;
            let speed = 3 + Math.random() * 2;

            function moveDog() {
                if (!dogAlarm.classList.contains('show') || timeLeft <= 0) return;

                posX += speed * directionX;
                posY += speed * directionY;

                if (posX <= 0 || posX >= screenWidth - dogSize) directionX *= -1;
                if (posY <= 0 || posY >= screenHeight - dogSize) directionY *= -1;

                if (posX > safeZone.left && posX < safeZone.right &&
                    posY > safeZone.top && posY < safeZone.bottom) {
                    directionX = posX < screenWidth / 2 ? -1 : 1;
                    directionY = posY < screenHeight / 2 ? -1 : 1;
                }

                dogAlarm.style.left = `${posX}px`;
                dogAlarm.style.top = `${posY}px`;

                requestAnimationFrame(moveDog);
            }
            moveDog();
        }

        // ══════════════════════════════════════════════
        // ── Confetti Animation 🎉
        // ══════════════════════════════════════════════
        const confettiCanvas = document.getElementById('confettiCanvas');
        const confettiCtx = confettiCanvas.getContext('2d');
        let confettiPieces = [];
        let confettiAnimId;

        function launchConfetti() {
            confettiPieces = [];
            const colors = ['#0039a6', '#ff0000', '#ffcc00', '#ffffff', '#4cd964', '#ff69b4', '#00bcd4'];
            for (let i = 0; i < 200; i++) {
                confettiPieces.push({
                    x: Math.random() * confettiCanvas.width,
                    y: -20 - Math.random() * 300,
                    w: 6 + Math.random() * 8,
                    h: 4 + Math.random() * 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speedY: 2 + Math.random() * 4,
                    speedX: -2 + Math.random() * 4,
                    rot: Math.random() * Math.PI * 2,
                    rotSpeed: -0.1 + Math.random() * 0.2,
                    swing: Math.random() * 2,
                    swingOff: Math.random() * Math.PI * 2
                });
            }

            let confTick = 0;
            function animConfetti() {
                confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                confTick++;
                let alive = false;

                for (const p of confettiPieces) {
                    if (p.y > confettiCanvas.height + 50) continue;
                    alive = true;
                    confettiCtx.save();
                    confettiCtx.translate(p.x, p.y);
                    confettiCtx.rotate(p.rot);
                    confettiCtx.fillStyle = p.color;
                    confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    confettiCtx.restore();

                    p.y += p.speedY;
                    p.x += p.speedX + Math.sin(confTick * 0.02 + p.swingOff) * p.swing;
                    p.rot += p.rotSpeed;
                }

                if (alive) {
                    confettiAnimId = requestAnimationFrame(animConfetti);
                } else {
                    confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                }
            }
            animConfetti();
        }

        // ══════════════════════════════════════════════
        // ── Time-Up Handling
        // ══════════════════════════════════════════════
        function showTimeUpMessage() {
            timeUpOverlay.classList.add('show');
            launchConfetti();

            if (soundEnabled && alarmSound) {
                alarmSound.currentTime = 0;
                alarmSound.play().catch(e => console.log("Error reproduciendo sonido:", e));
            }

            setTimeout(() => showFinalAlarm(), 10000);
            setTimeout(() => timeUpOverlay.classList.remove('show'), 15000);
        }

        function showFinalAlarm() {
            alarmMessage.classList.add('show');
            animateAlarmMessage();
            setTimeout(() => alarmMessage.classList.remove('show'), 5000);
        }

        function animateAlarmMessage() {
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            const messageWidth = 300;
            const messageHeight = 80;

            const containerRect = document.querySelector('.container').getBoundingClientRect();
            const safeZone = {
                top: containerRect.top - 20,
                bottom: containerRect.bottom + 20,
                left: containerRect.left - 20,
                right: containerRect.right + 20
            };

            let posX, posY;
            do {
                posX = Math.random() * (screenWidth - messageWidth);
                posY = Math.random() * (screenHeight - messageHeight);
            } while (
                posX > safeZone.left && posX < safeZone.right &&
                posY > safeZone.top && posY < safeZone.bottom
            );

            let directionX = Math.random() > 0.5 ? 1 : -1;
            let directionY = Math.random() > 0.5 ? 1 : -1;
            let speed = 2;

            function moveMessage() {
                if (!alarmMessage.classList.contains('show')) return;

                posX += speed * directionX;
                posY += speed * directionY;

                if (posX <= 0 || posX >= screenWidth - messageWidth) directionX *= -1;
                if (posY <= 0 || posY >= screenHeight - messageHeight) directionY *= -1;

                if (posX > safeZone.left && posX < safeZone.right &&
                    posY > safeZone.top && posY < safeZone.bottom) {
                    directionX = posX < screenWidth / 2 ? -1 : 1;
                    directionY = posY < screenHeight / 2 ? -1 : 1;
                }

                alarmMessage.style.left = `${posX}px`;
                alarmMessage.style.top = `${posY}px`;

                requestAnimationFrame(moveMessage);
            }
            moveMessage();
        }

        // ══════════════════════════════════════════════
        // ── Start / Pause / Reset
        // ══════════════════════════════════════════════
        function startTimer() {
            if (isRunning) return;

            // Only read inputs when starting fresh (not resuming from pause)
            if (!isPaused) {
                const hours = parseInt(hoursInput.value) || 0;
                const minutes = parseInt(minutesInput.value) || 0;
                const seconds = parseInt(secondsInput.value) || 0;
                totalTime = hours * 3600 + minutes * 60 + seconds;

                if (totalTime <= 0) {
                    messageElement.textContent = "¡Establece un tiempo mayor a 0!";
                    return false;
                }
                timeLeft = totalTime;
            }

            isRunning = true;
            isPaused = false;
            alarmTriggered = timeLeft <= 30 ? alarmTriggered : false;
            startBtn.disabled = true;
            pauseBtn.textContent = "⏸ Pausar";
            messageElement.textContent = "¡Tiempo en marcha!";

            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    isPaused = false;
                    alarmTriggered = false;
                    startBtn.disabled = false;
                    pauseBtn.textContent = "⏸ Pausar";
                    messageElement.textContent = "¡Tiempo terminado!";
                    progressBar.style.width = '100%';
                    updateIconPosition(100);
                    updateCircularProgress(100);

                    dogAlarm.classList.remove('show');
                    removeUrgencyEffects();
                    showTimeUpMessage();
                }
            }, 1000);
        }

        function togglePauseTimer() {
            if (!isRunning && !isPaused) return;

            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
                isPaused = true;
                pauseBtn.textContent = "▶ Reanudar";
                messageElement.textContent = "Temporizador en pausa";

                if (alarmSound) alarmSound.pause();
                dogAlarm.classList.remove('show');
                // Pause urgency effects
                document.querySelector('.container').classList.remove('urgency', 'urgency-shake');
                timerDisplay.classList.remove('urgency');
                dogImage.classList.remove('alarm');
            } else if (isPaused) {
                startTimer();
                if (timeLeft <= 30 && timeLeft > 0) {
                    dogAlarm.classList.add('show');
                }
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isPaused = false;
            alarmTriggered = false;
            startBtn.disabled = false;
            pauseBtn.textContent = "⏸ Pausar";

            hoursInput.value = 0;
            minutesInput.value = 0;
            secondsInput.value = 0;

            dogAlarm.classList.remove('show');
            timeUpOverlay.classList.remove('show');
            alarmMessage.classList.remove('show');
            removeUrgencyEffects();

            if (alarmSound) {
                alarmSound.pause();
                alarmSound.currentTime = 0;
            }

            // Clear confetti
            if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

            initializeTimer();
            messageElement.textContent = "¡Establece el tiempo y comienza!";
        }

        // Helper to clean up all urgency visual effects
        function removeUrgencyEffects() {
            document.querySelector('.container').classList.remove('urgency', 'urgency-shake');
            timerDisplay.classList.remove('urgency');
            progressRing.classList.remove('urgency');
            progressBar.classList.remove('urgency');
            messageElement.classList.remove('urgency');
            dogImage.classList.remove('alarm');
        }

        // ══════════════════════════════════════════════
        // ── Alarm Sound
        // ══════════════════════════════════════════════
        function createAlarmSound() {
            try {
                alarmSound = new Audio();
                const alarmBeep = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==";
                alarmSound.src = alarmBeep;
                alarmSound.loop = true;
            } catch (e) {
                console.log("No se pudo crear el sonido de alarma:", e);
            }
        }

        // ══════════════════════════════════════════════
        // ── Preload Dog Image (pre-processed transparent PNG)
        // ══════════════════════════════════════════════
        function preloadDogImage() {
            const img = new Image();
            img.src = 'wampo.png';
            img.onload = function () {
                dogImage.src = img.src;
            };
            img.onerror = function () {
                const fallbackSvg = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23FFCC00"/><circle cx="35" cy="40" r="8" fill="%23333"/><circle cx="65" cy="40" r="8" fill="%23333"/><path d="M40,65 Q50,75 60,65" stroke="%23333" stroke-width="3" fill="none"/><path d="M30,30 Q25,15 15,20" stroke="%23333" stroke-width="3" fill="none"/><path d="M70,30 Q75,15 85,20" stroke="%23333" stroke-width="3" fill="none"/></svg>';
                dogImage.src = fallbackSvg;
            };
        }

        // ══════════════════════════════════════════════
        // ── Event Listeners
        // ══════════════════════════════════════════════
        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', togglePauseTimer);
        resetBtn.addEventListener('click', resetTimer);

        // Close time-up overlay on click
        timeUpOverlay.addEventListener('click', () => {
            timeUpOverlay.classList.remove('show');
        });

        // ══════════════════════════════════════════════
        // ── Init
        // ══════════════════════════════════════════════
        window.addEventListener('DOMContentLoaded', () => {
            applySeason();
            hoursInput.value = 0;
            minutesInput.value = 0;
            secondsInput.value = 0;
            initializeTimer();
            preloadDogImage();
            createAlarmSound();
        });
    </script>
</body>

</html>
